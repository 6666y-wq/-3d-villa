      bridgeGroup.add(bridgeLanternGroup);

      const postGeo = getRoundedBoxGeometry(0.1, 1.95, 0.1);
      const armGeo = getRoundedBoxGeometry(0.5, 0.07, 0.07);
      for (const z of [BRIDGE_START_Z - 0.06, BRIDGE_END_Z + 0.06]) {
        for (const sx of [-1, 1]) {
          const postX = sx * (BRIDGE_HALF_WIDTH + 0.18);

          const post = new THREE.Mesh(postGeo, bridgeDarkMat);
          post.position.set(postX, 0.975, z);
          post.castShadow = false;
          post.receiveShadow = false;
          bridgeLanternGroup.add(post);

          const arm = new THREE.Mesh(armGeo, bridgeDarkMat);
          arm.position.set(postX + sx * 0.22, 1.9, z);
          arm.castShadow = false;
          arm.receiveShadow = false;
          bridgeLanternGroup.add(arm);

          bridgeLanternGroup.add(createRedLantern(postX + sx * 0.42, 1.6, z, 0.9));
        }
      }

      lanternGroups.porch = porchGroup;
      lanternGroups.bridge = bridgeLanternGroup;

    // ---------- 石桌石凳：别墅左侧草坪上的灰色圆柱组合 ----------
    const STONE_TABLE_X = -5.8;
    const STONE_TABLE_Z = -0.3;
    const STONE_TABLE_CLEARANCE = 2.2; // 草地散布时避开的半径
    const BAMBOO_GROVE_X = 6.95;
    const BAMBOO_GROVE_Z = -7.05;
    const BAMBOO_CLEARANCE = 1.7;

    function addStoneTableSet() {
      const group = new THREE.Group();
      group.name = 'stone-table-set';
      group.position.set(STONE_TABLE_X, 0, STONE_TABLE_Z);
      courtyard.add(group);

      const stoneMat = new THREE.MeshStandardMaterial({
        color: LIFE.stone, roughness: 0.96, metalness: 0.02, flatShading: true
      });
      const stoneDarkMat = new THREE.MeshStandardMaterial({
        color: LIFE.stoneDark, roughness: 0.98, metalness: 0.01, flatShading: true
      });

      const tableTop = new THREE.Mesh(
        new THREE.CylinderGeometry(0.82, 0.78, 0.09, 12),

      );
      tableTop.position.y = 0.74;
      group.add(tableTop);

      const tableNeck = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.25, 0.66, 8),

      );
      tableNeck.position.y = 0.37;

      const tableBase = new THREE.Mesh(

      }

      group.traverse((obj) => {
        if (!obj.isMesh) return;

      });

    }

    // ---------- 竹林：竹节用 InstancedMesh，竹叶用十字交叉面片 ----------
    function addBambooGrove() {
      const group = new THREE.Group();
      group.name = 'bamboo-grove';
      group.position.set(BAMBOO_GROVE_X, 0, BAMBOO_GROVE_Z);
      courtyard.add(group);

      const stalkCount = CONFIG.lifeCounts.bamboo;
      const culmGeo = new THREE.CylinderGeometry(1, 1.06, 1, 5);
      culmGeo.translate(0, 0.5, 0); // 原点移到底部，方便按节点向上叠加
      const ringGeo = new THREE.CylinderGeometry(1, 1, 1, 5);

      // 低多边形竹叶：两头尖的菱形叶片（4 顶点 / 2 三角），沿 +X 伸出
      function createBambooLeafGeometry() {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute([
          0, 0, 0,
          0.17, 0.062, 0,
          0.5, 0.012, 0.006,
          0.17, -0.052, 0
        ], 3));
        geo.setIndex([0, 1, 2, 0, 2, 3]);
        geo.computeVertexNormals();
        return geo;
      }
      const leafA = createBambooLeafGeometry();
      const leafB = leafA.clone();
      leafB.rotateX(Math.PI / 2);
      const leafGeo = mergeGeometries([leafA, leafB]);
      leafA.dispose();
      leafB.dispose();

      const culmMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.86, metalness: 0.02
      });
      const ringMat = new THREE.MeshStandardMaterial({
        color: LIFE.bambooNode, roughness: 0.9, metalness: 0.01
      });
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.82, metalness: 0, side: THREE.DoubleSide
      });

      const culmMatrices = [];
      const ringMatrices = [];
      const leafMatrices = [];
      const culmColors = [];
      const leafColors = [];
      const culmTones = [
        new THREE.Color(LIFE.bambooCulm),
        new THREE.Color(0x4f7a38),
        new THREE.Color(0x6f9d4c)
      ];
      const leafTones = [
        new THREE.Color(LIFE.bambooLeaf),
        new THREE.Color(0x7fbc5b),
        new THREE.Color(0x5c9440)
      ];

      const dummy = new THREE.Object3D();
      const offset = new THREE.Vector3();
      const stalkQuat = new THREE.Quaternion();
      const leafQuat = new THREE.Quaternion();
      const euler = new THREE.Euler();

      for (let i = 0; i < stalkCount; i++) {
        const angle = lifeRandom() * Math.PI * 2;
        const radius = Math.sqrt(lifeRandom()) * 1.15;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        const height = 1.8 + lifeRandom() * 1.9;         // 1.8~3.7m 高
        const thickness = 0.028 + lifeRandom() * 0.014;  // 极细竹竿
        const segments = 4 + Math.floor(lifeRandom() * 2); // 4~5 节
        const segH = height / segments;

        euler.set(
          (lifeRandom() - 0.5) * 0.16,
          lifeRandom() * Math.PI * 2,
          (lifeRandom() - 0.5) * 0.16
        );
        stalkQuat.setFromEuler(euler);
        const culmColor = culmTones[i % culmTones.length];

        for (let s = 0; s < segments; s++) {
          offset.set(0, s * segH, 0).applyQuaternion(stalkQuat);
          dummy.position.set(x + offset.x, offset.y, z + offset.z);
          dummy.quaternion.copy(stalkQuat);
          dummy.scale.set(thickness, segH, thickness);
          dummy.updateMatrix();
          culmMatrices.push(dummy.matrix.clone());
          culmColors.push(culmColor);

          // 竹节：略粗的深绿箍
          offset.set(0, (s + 1) * segH, 0).applyQuaternion(stalkQuat);
          dummy.position.set(x + offset.x, offset.y, z + offset.z);
          dummy.quaternion.copy(stalkQuat);
          dummy.scale.set(thickness * 1.22, 0.028, thickness * 1.22);
          dummy.updateMatrix();
          ringMatrices.push(dummy.matrix.clone());
        }

        // 竹叶：每根 5 簇十字叶片，集中在竹梢并带自然倾角
        for (let l = 0; l < 5; l++) {
          const leafY = height * (0.6 + l * 0.095);
          offset.set(0, leafY, 0).applyQuaternion(stalkQuat);
          euler.set(
            (lifeRandom() - 0.5) * 0.9,
            lifeRandom() * Math.PI * 2,
            (lifeRandom() - 0.5) * 0.55
          );
          leafQuat.setFromEuler(euler);
          dummy.position.set(x + offset.x, offset.y, z + offset.z);
          dummy.quaternion.copy(stalkQuat).multiply(leafQuat);
          dummy.scale.setScalar(0.8 + lifeRandom() * 0.5);
          dummy.updateMatrix();
          leafMatrices.push(dummy.matrix.clone());
          leafColors.push(leafTones[(i + l) % leafTones.length]);
        }
      }

      const culmMesh = new THREE.InstancedMesh(culmGeo, culmMat, culmMatrices.length);
      culmMesh.name = 'bamboo-culms';
      culmMesh.castShadow = false;
      culmMesh.receiveShadow = true;
      culmMesh.frustumCulled = false;
      culmMatrices.forEach((matrix, i) => {
        culmMesh.setMatrixAt(i, matrix);
        culmMesh.setColorAt(i, culmColors[i]);
      });
      culmMesh.instanceMatrix.needsUpdate = true;
      if (culmMesh.instanceColor) culmMesh.instanceColor.needsUpdate = true;
      group.add(culmMesh);

      const ringMesh = new THREE.InstancedMesh(ringGeo, ringMat, ringMatrices.length);
      ringMesh.name = 'bamboo-nodes';
      ringMesh.castShadow = false;
      ringMesh.receiveShadow = true;
      ringMesh.frustumCulled = false;
      ringMatrices.forEach((matrix, i) => ringMesh.setMatrixAt(i, matrix));
      ringMesh.instanceMatrix.needsUpdate = true;
      group.add(ringMesh);

      const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, leafMatrices.length);
      leafMesh.name = 'bamboo-leaves';
      leafMesh.castShadow = false;
      leafMesh.receiveShadow = true;
      leafMesh.frustumCulled = false;
      leafMatrices.forEach((matrix, i) => {
        leafMesh.setMatrixAt(i, matrix);
        leafMesh.setColorAt(i, leafColors[i]);
      });
      leafMesh.instanceMatrix.needsUpdate = true;
      if (leafMesh.instanceColor) leafMesh.instanceColor.needsUpdate = true;
      group.add(leafMesh);

      return group;
    }

    // ---------- 乌篷船：半潜艇身 + 半圆篷 + 船头小红灯笼 ----------
    function addBoat() {
      const group = new THREE.Group();
      group.name = 'wupeng-boat';
      group.position.set(8.6, 0.02, RIVER_CENTER_Z + 0.25);
      group.rotation.y = -0.08;
      scene.add(group);

      const hullMat = new THREE.MeshStandardMaterial({
        color: LIFE.boatHull, roughness: 0.86, metalness: 0.04
      });
      const boatTrimMat = new THREE.MeshStandardMaterial({
        color: LIFE.boatTrim, roughness: 0.78, metalness: 0.05
      });
      const canopyMat = new THREE.MeshStandardMaterial({
        color: LIFE.boatCanopy, roughness: 0.9, metalness: 0.03, side: THREE.DoubleSide
      });

      // 拉长的低面数胶囊体做船身，压扁后下半部分浸入水中
      const hullGeo = new THREE.CapsuleGeometry(0.55, 1.9, 4, 8);
      hullGeo.rotateZ(Math.PI / 2);
      const hull = new THREE.Mesh(hullGeo, hullMat);
      hull.scale.set(1, 0.62, 0.84);
      hull.position.y = 0.24;
      group.add(hull);

      // 船底木板 + 两道坐板
      const floor = new THREE.Mesh(getRoundedBoxGeometry(1.9, 0.05, 0.5), boatTrimMat);
      floor.position.y = 0.42;
      group.add(floor);
      for (const bx of [-0.58, 0.58]) {
        const bench = new THREE.Mesh(getRoundedBoxGeometry(0.2, 0.06, 0.56), boatTrimMat);
        bench.position.set(bx, 0.5, 0);
        group.add(bench);
      }

      // 乌篷：半圆柱开口朝下
      const canopyGeo = new THREE.CylinderGeometry(0.55, 0.55, 1.35, 8, 1, true, 0, Math.PI);
      canopyGeo.rotateZ(Math.PI / 2);
      const canopy = new THREE.Mesh(canopyGeo, canopyMat);
      canopy.position.set(-0.12, 0.55, 0);
      group.add(canopy);

      // 三道竹篾拱肋
      const hoopGeo = new THREE.TorusGeometry(0.56, 0.022, 4, 8, Math.PI);
      hoopGeo.rotateY(Math.PI / 2);
      for (const hx of [-0.72, -0.12, 0.48]) {
        const hoop = new THREE.Mesh(hoopGeo, boatTrimMat);
        hoop.position.set(hx, 0.55, 0);
        group.add(hoop);
      }

      // 船舷压条
      for (const sz of [-1, 1]) {
        const rail = new THREE.Mesh(getRoundedBoxGeometry(2.25, 0.06, 0.05), boatTrimMat);
        rail.position.set(0, 0.53, sz * 0.44);
        group.add(rail);
      }

      // 船头一盏小红灯笼，夜里和桥头灯笼一起泛红晕
      group.add(createRedLantern(1.02, 0.9, 0, 0.62));

      group.traverse((obj) => {
        if (!obj.isMesh) return;
        obj.castShadow = false;
        obj.receiveShadow = true;
      });

      return { group, homeY: group.position.y, baseYaw: group.rotation.y };
    }

    // ---------- 芦苇丛：两根 InstancedMesh（细茎 + 棕色穗），随风摇摆 ----------
    function addReeds() {
      const count = CONFIG.lifeCounts.reeds;
      const stemGeo = new THREE.CylinderGeometry(0.008, 0.018, 1, 4);
      stemGeo.translate(0, 0.5, 0); // 原点在根部，绕根部摆动
      const headGeo = new THREE.CylinderGeometry(0.028, 0.012, 0.24, 4);

      const stemMat = new THREE.MeshStandardMaterial({
        color: 0xffffff, roughness: 0.9, metalness: 0
      });
      const headMat = new THREE.MeshStandardMaterial({
        color: LIFE.reedHead, roughness: 0.95, metalness: 0
      });

      const stemMesh = new THREE.InstancedMesh(stemGeo, stemMat, count);
      const headMesh = new THREE.InstancedMesh(headGeo, headMat, count);
      stemMesh.name = 'reeds-stems';
      headMesh.name = 'reeds-heads';
      for (const mesh of [stemMesh, headMesh]) {
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.frustumCulled = false;
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        scene.add(mesh);
      }

      const stemTones = [
        new THREE.Color(LIFE.reedStem),
        new THREE.Color(0x8a9660),
        new THREE.Color(0xa9b37a)
      ];
      const reeds = [];

      for (let i = 0; i < count; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        let x = 0;
        for (let attempt = 0; attempt < 12; attempt++) {
          x = (lifeRandom() - 0.5) * 2 * (RIVER_HALF_LENGTH - 7);
          if (Math.abs(x) > BRIDGE_HALF_WIDTH + 2.2) break; // 让开木桥
        }

        reeds.push({
          x,
          z: RIVER_CENTER_Z + side * (RIVER_HALF_WIDTH + 0.12 + lifeRandom() * 0.95),
          height: 0.9 + lifeRandom() * 1.15,
          width: 0.8 + lifeRandom() * 0.5,
          yaw: lifeRandom() * Math.PI * 2,
          leanX: (lifeRandom() - 0.5) * 0.18,
          leanZ: (lifeRandom() - 0.5) * 0.18,
          phase: lifeRandom() * Math.PI * 2,
          speed: 0.45 + lifeRandom() * 0.55,
          headScale: 0.8 + lifeRandom() * 0.4
        });
        stemMesh.setColorAt(i, stemTones[i % stemTones.length]);
      }
      if (stemMesh.instanceColor) stemMesh.instanceColor.needsUpdate = true;

      return {
        stemMesh,
        headMesh,
        reeds,
        dummy: new THREE.Object3D(),
        headDummy: new THREE.Object3D(),
        topOffset: new THREE.Vector3()
      };
    }

    // time 来自 clock.elapsedTime；每帧只更新实例矩阵，不新增 draw call
    function updateReeds(state, time) {
      const { stemMesh, headMesh, reeds, dummy, headDummy, topOffset } = state;

      for (let i = 0; i < reeds.length; i++) {
        const reed = reeds[i];
        const sway = Math.sin(time * reed.speed + reed.phase);

        dummy.position.set(reed.x, 0, reed.z);
        dummy.rotation.set(
          reed.leanX + sway * 0.05,
          reed.yaw,
          reed.leanZ + Math.cos(time * reed.speed * 0.83 + reed.phase) * 0.035
        );
        dummy.scale.set(reed.width, reed.height, reed.width);
        dummy.updateMatrix();
        stemMesh.setMatrixAt(i, dummy.matrix);

        // 穗子跟着茎尖一起摆：先求旋转后的茎顶偏移，再放到穗子中心
        topOffset.set(0, reed.height, 0).applyQuaternion(dummy.quaternion);
        headDummy.position.set(reed.x + topOffset.x, topOffset.y, reed.z + topOffset.z);
        headDummy.rotation.copy(dummy.rotation);
        headDummy.scale.setScalar(reed.headScale);
        headDummy.updateMatrix();
        headMesh.setMatrixAt(i, headDummy.matrix);
      }

      stemMesh.instanceMatrix.needsUpdate = true;
      headMesh.instanceMatrix.needsUpdate = true;
    }

    // ---------- 夜空孔明灯：暖黄自发光纸罩 + 一点火芯，夜里缓慢升空 ----------
    function addSkyLanterns() {
      const count = CONFIG.lifeCounts.skyLanterns;
      const group = new THREE.Group();
      group.name = 'sky-lanterns';
      group.visible = false; // 白昼不显示，updateDayNight 之后由 updateSkyLanterns 打开
      scene.add(group);

      const bodyGeo = new THREE.CylinderGeometry(0.23, 0.16, 0.5, 7);
      const paperMat = new THREE.MeshStandardMaterial({
        color: 0x3a220c,
        emissive: LIFE.skyLanternPaper,
        emissiveIntensity: 1.5, // 刚过 Bloom 阈值，夜空中是一团柔和的暖黄
        roughness: 0.9,
        metalness: 0
      });
      const bodyMesh = new THREE.InstancedMesh(bodyGeo, paperMat, count);
      bodyMesh.name = 'sky-lantern-papers';
      bodyMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      bodyMesh.frustumCulled = false;
      bodyMesh.castShadow = false;
      bodyMesh.receiveShadow = false;
      group.add(bodyMesh);

      const flameGeo = new THREE.SphereGeometry(0.055, 6, 4);
      const flameMat = new THREE.MeshBasicMaterial({ color: LIFE.skyLanternFlame });
      const flameMesh = new THREE.InstancedMesh(flameGeo, flameMat, count);
      flameMesh.name = 'sky-lantern-flames';
      flameMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      flameMesh.frustumCulled = false;
      flameMesh.castShadow = false;
      flameMesh.receiveShadow = false;
      group.add(flameMesh);

      const data = [];
      for (let i = 0; i < count; i++) {
        // 起点避开别墅正上方，免得刚从地面升起时穿过屋顶 / 屋檐
        let x = 0;
        let z = 0;
        for (let attempt = 0; attempt < 12; attempt++) {
          x = (lifeRandom() - 0.5) * 32;
          z = (lifeRandom() - 0.5) * 34 + 4;
          if (Math.abs(x) > 5.5 || Math.abs(z) > 5.5) break;
        }

        data.push({
          // 横向铺满整个院子 / 河道上空；初始高度错开，开灯时已经有几盏在半空
          x,
          z,
          y: 0.8 + lifeRandom() * 15,
          rise: 0.22 + lifeRandom() * 0.24,      // m/s，缓慢上升
          swayAmp: 0.28 + lifeRandom() * 0.7,
          speed: 0.32 + lifeRandom() * 0.45,
          phase: lifeRandom() * Math.PI * 2,
          scale: 0.75 + lifeRandom() * 0.5
        });
      }

      return {
        group,
        bodyMesh,
        flameMesh,
        data,
        dummy: new THREE.Object3D(),
        flameDummy: new THREE.Object3D()
      };
    }

    function updateSkyLanterns(state, dt, time, nightFactor) {
      const visible = nightFactor > 0.45;
      state.group.visible = visible;
      if (!visible) return; // 白天整组隐藏，连带跳过所有实例矩阵计算

      const { bodyMesh, flameMesh, data, dummy, flameDummy } = state;
      for (let i = 0; i < data.length; i++) {
        const lamp = data[i];
        lamp.y += lamp.rise * dt;
        if (lamp.y > 24) lamp.y = 0.5; // 升到高空后回到地面附近，循环重来

        const swayX = Math.sin(time * lamp.speed + lamp.phase) * lamp.swayAmp;
        const swayZ = Math.cos(time * lamp.speed * 0.77 + lamp.phase) * lamp.swayAmp * 0.65;

        dummy.position.set(lamp.x + swayX, lamp.y, lamp.z + swayZ);
        dummy.rotation.set(
          Math.cos(time * lamp.speed * 0.63 + lamp.phase) * 0.06,
          lamp.phase + time * 0.05,
          Math.sin(time * lamp.speed + lamp.phase) * 0.08
        );
        dummy.scale.setScalar(lamp.scale);
        dummy.updateMatrix();
        bodyMesh.setMatrixAt(i, dummy.matrix);

        // 火芯在纸罩正下方，亮度做轻微呼吸
        flameDummy.position.set(lamp.x + swayX, lamp.y - 0.26 * lamp.scale, lamp.z + swayZ);
        flameDummy.rotation.copy(dummy.rotation);
        flameDummy.scale.setScalar(lamp.scale * (1 + Math.sin(time * 7 + lamp.phase) * 0.12));
        flameDummy.updateMatrix();
        flameMesh.setMatrixAt(i, flameDummy.matrix);
      }

      bodyMesh.instanceMatrix.needsUpdate = true;
      flameMesh.instanceMatrix.needsUpdate = true;
    }

    // ---------- 一次性挂载生活化细节 ----------
    // 放在场景骨架（别墅 / 庭院 / 河道 / 木桥）搭好之后，函数声明已全部就绪
    const lifeDetails = {
      lanterns: addLanterns(),
      stoneTable: addStoneTableSet(),
      bamboo: addBambooGrove(),
      boat: addBoat(),
      reeds: addReeds(),
      skyLanterns: addSkyLanterns()
    };
    updateReeds(lifeDetails.reeds, 0); // 先写一次初始矩阵，第一帧之前芦苇就位

    // ---------- 高性能草地：GRASS_COUNT 个草实例，单个 InstancedMesh ----------
    // 每个实例 6 片两段式叶片（18 个三角面），10 个实例聚成一簇；
    // 4800 个实例约 8.6 万个面，但只有 1 个 draw call，远轻于几千个独立 Mesh。
    const grassSpots = [];
    const GRASS_TONES = [0x5a8a45, 0x6b9b4f, 0x7cab5b, 0x8dbb6a]; // 中绿 → 浅绿，贴近草坪底色

    function pushGrassSpot(x, z, minH, maxH, minW = 1.0, maxW = 1.8, tone = null) {
      grassSpots.push({
        x, z,
        height: minH + gardenDetailRandom() * (maxH - minH),
        width: minW + gardenDetailRandom() * (maxW - minW),
        yaw: gardenDetailRandom() * Math.PI * 2,
        tiltX: (gardenDetailRandom() - 0.5) * 0.22,
        tiltZ: (gardenDetailRandom() - 0.5) * 0.22,
        tone: tone ?? GRASS_TONES[Math.floor(gardenDetailRandom() * GRASS_TONES.length)]
      });
    }

    // 一簇 = GRASS_CLUMP_SIZE 个草实例，围绕同一个中心小范围聚集；
    // 同一簇共用颜色，远看是一块蓬松的草团，而不是均匀撒开的“芝麻”。
    function pushGrassClump(
      cx, cz, count, minH, maxH,
      minW = 1.0, maxW = 1.8, radius = GRASS_CLUMP_RADIUS
    ) {
      const tone = GRASS_TONES[Math.floor(gardenDetailRandom() * GRASS_TONES.length)];
      for (let i = 0; i < count; i++) {
        const angle = gardenDetailRandom() * Math.PI * 2;
        const r = Math.sqrt(gardenDetailRandom()) * radius;
        pushGrassSpot(
          cx + Math.cos(angle) * r,
          cz + Math.sin(angle) * r,
          minH, maxH, minW, maxW, tone
        );
      }
    }

    // 数量按“簇”分配：庭院 38% / 河岸 24% / 每棵树 2 簇 / 其余外围草地，
    // 保持总量约等于 GRASS_COUNT，避免各段向上取整后草地数量虚高。
    const grassClumpTotal = Math.round(GRASS_COUNT / GRASS_CLUMP_SIZE);
    const courtyardClumpCount = Math.round(grassClumpTotal * 0.38);
    const bankClumpCount = Math.round(grassClumpTotal * 0.24);
    const treeClumpCount = TREE_LAYOUT.length * 2;
    const meadowClumpCount = Math.max(
      0,
      grassClumpTotal - courtyardClumpCount - bankClumpCount - treeClumpCount
    );

    // 1) 别墅周围 / 庭院草坪：避开台基、石板路与四角灌木
    for (let i = 0; i < courtyardClumpCount; i++) {
      let x = COURTYARD_HALF - 0.8;
      let z = COURTYARD_HALF - 0.8;
      for (let attempt = 0; attempt < 16; attempt++) {
        const cx = (gardenDetailRandom() - 0.5) * (COURTYARD_HALF * 2 - 0.9);
        const cz = (gardenDetailRandom() - 0.5) * (COURTYARD_HALF * 2 - 0.9);
        if (Math.abs(cx) < 4.15 && Math.abs(cz) < 4.15) continue;          // 别墅台基
        if (Math.abs(cx) < 1.5 && cz > pathStartZ - 0.4) continue;          // 入户石径
        if (Math.hypot(cx - STONE_TABLE_X, cz - STONE_TABLE_Z) < STONE_TABLE_CLEARANCE) continue; // 石桌石凳
        if (Math.hypot(cx - BAMBOO_GROVE_X, cz - BAMBOO_GROVE_Z) < BAMBOO_CLEARANCE) continue;   // 竹林根部
        let inBush = false;
        for (const [bx, bz] of COURTYARD_BUSH_SPOTS) {
          if (Math.hypot(cx - bx, cz - bz) < 1.05) { inBush = true; break; }
        }
        if (inBush) continue;
        x = cx;
        z = cz;
        break;
      }
      // 院内草坪：修剪得更短，但仍以 10 个实例为一簇，不再是一根一根的芝麻
      pushGrassClump(x, z, GRASS_CLUMP_SIZE, 0.16, 0.32, 1.0, 1.6, 0.35);
    }

    // 2) 河流两岸：贴近水边成簇生长，草更高更蓬松
    for (let i = 0; i < bankClumpCount; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      let x = 0;
      for (let attempt = 0; attempt < 10; attempt++) {
        x = (gardenDetailRandom() - 0.5) * 2 * 32;
        if (Math.abs(x) > BRIDGE_HALF_WIDTH + 0.7) break; // 让开木桥
      }
      const margin = 0.15 + gardenDetailRandom() * 1.25;
      const z = RIVER_CENTER_Z + side * (RIVER_HALF_WIDTH + margin);
      pushGrassClump(x, z, GRASS_CLUMP_SIZE, 0.3, 0.55, 1.1, 1.8, 0.3);
    }

    // 3) 树林下方：每棵树底部放 2 簇草，树不再是“插在空地上”
    for (const [tx, tz] of TREE_LAYOUT) {
      for (let c = 0; c < treeClumpCount / TREE_LAYOUT.length; c++) {
        const angle = gardenDetailRandom() * Math.PI * 2;
        const radius = 0.7 + gardenDetailRandom() * 0.55;
        pushGrassClump(
          tx + Math.cos(angle) * radius,
          tz + Math.sin(angle) * radius,
          GRASS_CLUMP_SIZE,
          0.26, 0.5, 1.0, 1.7, 0.34
        );
      }
    }

    // 4) 外围草地：先撒若干“草丛中心”，每个中心再放 3~4 簇（10 实例 / 簇）
    const meadowPatchCount = Math.max(36, Math.round(meadowClumpCount / 4));
    const meadowPatches = [];
    let meadowPatchGuard = 0;
    while (meadowPatches.length < meadowPatchCount && meadowPatchGuard++ < meadowPatchCount * 30) {
      const cx = (gardenDetailRandom() - 0.5) * 2 * 33;
      const cz = (gardenDetailRandom() - 0.5) * 2 * 33;
      const insideCourtyard =
        Math.abs(cx) < COURTYARD_HALF + 1.2 && Math.abs(cz) < COURTYARD_HALF + 1.2;
      const inRiver = Math.abs(cz - RIVER_CENTER_Z) < RIVER_HALF_WIDTH + 0.6;
      const onBridge =
        Math.abs(cx) < BRIDGE_HALF_WIDTH + 1.2 &&
        cz > BRIDGE_START_Z - 1 && cz < BRIDGE_END_Z + 1;
      if (insideCourtyard || inRiver || onBridge) continue;
      meadowPatches.push([cx, cz]);
    }
    // 极端情况下兜底，避免下面的取模访问到空数组
    if (meadowPatches.length === 0) meadowPatches.push([COURTYARD_HALF + 8, -COURTYARD_HALF - 8]);

    for (let i = 0; i < meadowClumpCount; i++) {
      const patch = meadowPatches[i % meadowPatches.length];
      let x = patch[0];
      let z = patch[1];
      for (let attempt = 0; attempt < 12; attempt++) {
        const angle = gardenDetailRandom() * Math.PI * 2;
        const radius = 0.3 + Math.sqrt(gardenDetailRandom()) * 1.9;
        const cx = patch[0] + Math.cos(angle) * radius;
        const cz = patch[1] + Math.sin(angle) * radius;
        const inVilla = Math.abs(cx) < 4.6 && Math.abs(cz) < 4.6;
        const inRiver = Math.abs(cz - RIVER_CENTER_Z) < RIVER_HALF_WIDTH + 0.7;
        const onBridge =
          Math.abs(cx) < BRIDGE_HALF_WIDTH + 0.8 &&
          cz > BRIDGE_START_Z - 0.4 && cz < BRIDGE_END_Z + 0.4;
        if (!inVilla && !inRiver && !onBridge) {
          x = cx;
          z = cz;
          break;
        }
      }
      pushGrassClump(x, z, GRASS_CLUMP_SIZE, 0.24, 0.48, 1.1, 1.85, 0.36);
    }

    // 草叶几何：每丛 6 片两段式叶片（下宽上尖、向外微弯），
    // 叶片比旧版宽约 1.5 倍；每片 3 个三角形，一丛 18 个三角形，仍然只有 1 个 draw call。
    function createGrassTuftGeometry() {
      // w 是半宽：实际叶宽 = 2 × w = 0.058~0.078，细叶才不会像小灌木
      const blades = [
        { ox: 0.0, oz: 0.0, yaw: 0.4, h: 1.0, w: 0.039 },
        { ox: 0.09, oz: 0.05, yaw: 1.7, h: 0.82, w: 0.036 },
        { ox: -0.08, oz: 0.06, yaw: 2.9, h: 0.9, w: 0.034 },
        { ox: 0.03, oz: -0.08, yaw: 4.3, h: 0.74, w: 0.031 },
        { ox: -0.04, oz: -0.02, yaw: 5.4, h: 0.88, w: 0.035 },
        { ox: 0.1, oz: -0.06, yaw: 3.6, h: 0.66, w: 0.029 }
      ];
      const positions = [];
      const indices = [];

      for (const blade of blades) {
        const c = Math.cos(blade.yaw);
        const s = Math.sin(blade.yaw);
        const base = positions.length / 3;
        // 局部坐标：x 为叶宽方向，z 为叶片外弯方向，绕 Y 旋转后摆进草丛
        const push = (lx, y, lz) => {
          positions.push(
            blade.ox + lx * c + lz * s,
            y * blade.h,
            blade.oz - lx * s + lz * c
          );
        };
        push(-blade.w, 0, 0);                            // 0 左下
        push(blade.w, 0, 0);                             // 1 右下
        push(-blade.w * 0.62, 0.55, blade.w * 0.5);      // 2 中左
        push(blade.w * 0.62, 0.55, blade.w * 0.5);       // 3 中右
        push(blade.w * 0.06, 1, blade.w * 1.9);          // 4 叶尖（略向外弯）
        indices.push(
          base, base + 1, base + 3,
          base, base + 3, base + 2,
          base + 2, base + 3, base + 4
        );
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }
    const grassGeo = createGrassTuftGeometry();

    const grassMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,        // 基色保持白色，真正的绿色来自 instanceColor（昼夜再统一染色）
      roughness: 0.95,
      metalness: 0,
      side: THREE.DoubleSide // 从背面看草叶也有颜色，不会出现黑面
    });

    // ---------- 草地风场：顶点着色器位移 ----------
    // 4800 个实例仍然只有 1 个 draw call，只在顶点阶段根据叶片高度和世界位置做正弦弯曲；
    // 根部（y=0）完全不动，叶尖（y=1）摆幅最大，看起来像一阵风从草地掠过。
    const grassWindUniforms = {
      uTime: { value: 0 },
      uStrength: { value: CONFIG.grass.windStrength }
    };
    grassMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = grassWindUniforms.uTime;
      shader.uniforms.uStrength = grassWindUniforms.uStrength;

      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        `#include <common>
        uniform float uTime;
        uniform float uStrength;`
      );

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 grassOrigin = vec3(instanceMatrix[3].x, instanceMatrix[3].y, instanceMatrix[3].z);
        #else
          vec3 grassOrigin = vec3(0.0);
        #endif
        float bladeMask = clamp(transformed.y, 0.0, 1.0);
        float gust = sin(uTime * ${CONFIG.grass.windSpeed.toFixed(3)} + grassOrigin.x * 0.55 + grassOrigin.z * 0.47)
                   + 0.55 * sin(uTime * ${(CONFIG.grass.windSpeed * 2.3).toFixed(3)} + grassOrigin.x * 1.7 + grassOrigin.z * 0.9);
        float bend = gust * uStrength * bladeMask * bladeMask;
        transformed.x += bend * 0.2;
        transformed.z += bend * 0.12;`
      );
    };
    // 同一份材质在程序缓存里保持唯一 key，避免热更新时复用旧 shader
    grassMat.customProgramCacheKey = () => 'villa-grass-wind';

    const grassMesh = new THREE.InstancedMesh(grassGeo, grassMat, grassSpots.length);
    grassMesh.name = 'grass-field';
    grassMesh.castShadow = false;    // 草不投影：4800 个实例投影太贵，性能优先
    grassMesh.receiveShadow = true;  // 但草要接住别墅 / 树的影子，才不会像贴纸

    const grassDummy = new THREE.Object3D();
    const grassColor = new THREE.Color();
    grassSpots.forEach((spot, i) => {
      grassDummy.position.set(spot.x, 0.016, spot.z);
      grassDummy.rotation.set(spot.tiltX, spot.yaw, spot.tiltZ);
      grassDummy.scale.set(spot.width, spot.height, spot.width);
      grassDummy.updateMatrix();
      grassMesh.setMatrixAt(i, grassDummy.matrix);
      grassMesh.setColorAt(i, grassColor.setHex(spot.tone));
    });
    grassMesh.instanceMatrix.needsUpdate = true;
    if (grassMesh.instanceColor) grassMesh.instanceColor.needsUpdate = true;
    // 实例分布很广，必须按实例矩阵重算包围球，否则视锥剔除会把整片草误剔掉
    grassMesh.computeBoundingSphere?.();
    scene.add(grassMesh);

    // ---------- 灌木丛：别墅墙角 / 树底 / 草地边缘，低面数多面体 ----------
    const shrubRandom = makeRandom(20261113);
    const shrubSpots = [];
    const SHRUB_TONES = [0x3f7a4d, 0x4a8b58, 0x356b45]; // 比树冠稍亮一点

    function pushShrub(x, z, r) {
      shrubSpots.push({
        x, z,
        r,
        sy: r * (0.62 + shrubRandom() * 0.28),
        yaw: shrubRandom() * Math.PI * 2,
        tone: SHRUB_TONES[Math.floor(shrubRandom() * SHRUB_TONES.length)]
      });
    }

    // 别墅四个墙角 + 每面墙的中间，紧贴台基外缘
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        pushShrub(sx * 4.05, sz * 4.05, 0.52 + shrubRandom() * 0.18);
      }
    }
    for (const s of [-1, 1]) {
      pushShrub(s * 4.05, 1.35, 0.36);
      pushShrub(s * 4.05, -1.35, 0.36);
      pushShrub(1.35, s * 4.05, 0.36);
      pushShrub(-1.35, s * 4.05, 0.36);
    }

    // 每棵树底部 3 丛，弱化树干与地面的生硬接缝
    for (const [tx, tz] of TREE_LAYOUT) {
      for (let i = 0; i < 3; i++) {
        const angle = shrubRandom() * Math.PI * 2;
        const radius = 0.65 + shrubRandom() * 0.55;
        pushShrub(
          tx + Math.cos(angle) * radius,
          tz + Math.sin(angle) * radius,
          0.34 + shrubRandom() * 0.22
        );
      }
    }

    // 剩余数量撒在外围草地（避开庭院、河道、木桥与漫游走廊）
    let shrubGuard = 0;
    while (shrubSpots.length < SHRUB_COUNT && shrubGuard++ < SHRUB_COUNT * 24) {
      const x = (shrubRandom() - 0.5) * 2 * 28;
      const z = (shrubRandom() - 0.5) * 2 * 28;
      const insideCourtyard =
        Math.abs(x) < COURTYARD_HALF + 0.6 && Math.abs(z) < COURTYARD_HALF + 0.6;
      const inRiver = Math.abs(z - RIVER_CENTER_Z) < RIVER_HALF_WIDTH + 0.6;
      const inCorridor =
        Math.abs(x) < 2.2 && z > COURTYARD_HALF && z < BRIDGE_END_Z + 2;
      if (insideCourtyard || inRiver || inCorridor) continue;
      pushShrub(x, z, 0.32 + shrubRandom() * 0.3);
    }

    const shrubGeo = new THREE.IcosahedronGeometry(1, 1);
    const shrubMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, // 同样用 instanceColor 上色，昼夜由材质整体染色
      roughness: 0.93,
      metalness: 0,
      flatShading: true
    });
    const shrubMesh = new THREE.InstancedMesh(shrubGeo, shrubMat, shrubSpots.length);
    shrubMesh.name = 'shrub-field';
    shrubMesh.castShadow = true;
    shrubMesh.receiveShadow = true;

    const shrubDummy = new THREE.Object3D();
    const shrubColor = new THREE.Color();
    shrubSpots.forEach((spot, i) => {
      // 球心略低于半径：底部埋进草地，看起来是“长”出来的
      shrubDummy.position.set(spot.x, spot.sy * 0.62, spot.z);
      shrubDummy.rotation.set(0, spot.yaw, 0);
      shrubDummy.scale.set(spot.r, spot.sy, spot.r);
      shrubDummy.updateMatrix();
      shrubMesh.setMatrixAt(i, shrubDummy.matrix);
      shrubMesh.setColorAt(i, shrubColor.setHex(spot.tone));
    });
    shrubMesh.instanceMatrix.needsUpdate = true;
    if (shrubMesh.instanceColor) shrubMesh.instanceColor.needsUpdate = true;
    shrubMesh.computeBoundingSphere?.();
    scene.add(shrubMesh);

    // ---------- 石头：河流两岸 / 草地交界，十二面体随机缩放旋转 ----------
    const stoneRandom = makeRandom(20261114);
    const stoneSpots = [];
    const STONE_TONES = [0xc8cbc4, 0xaeb2ad, 0x989d99, 0xd8d9d2]; // 灰白

    function pushStone(x, z, r) {
      stoneSpots.push({
        x, z,
        sx: r * (0.8 + stoneRandom() * 0.7),
        sy: r * (0.55 + stoneRandom() * 0.55),
        sz: r * (0.8 + stoneRandom() * 0.7),
        rx: stoneRandom() * Math.PI,
        ry: stoneRandom() * Math.PI * 2,
        rz: stoneRandom() * Math.PI,
        tone: STONE_TONES[Math.floor(stoneRandom() * STONE_TONES.length)]
      });
    }

    // 60% 的石头贴着两岸水线摆放，10cm~40cm 高
    const bankStoneCount = Math.round(STONE_COUNT * 0.6);
    for (let i = 0; i < bankStoneCount; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      let x = 0;
      for (let attempt = 0; attempt < 10; attempt++) {
        x = (stoneRandom() - 0.5) * 2 * 30;
        if (Math.abs(x) > BRIDGE_HALF_WIDTH + 0.9) break; // 桥下不放石头
      }
      const z = RIVER_CENTER_Z + side * (RIVER_HALF_WIDTH - 0.15 + stoneRandom() * 0.75);
      pushStone(x, z, 0.12 + stoneRandom() * 0.28);
    }

    // 其余零散分布在草地与河道之间
    let stoneGuard = 0;
    while (stoneSpots.length < STONE_COUNT && stoneGuard++ < STONE_COUNT * 24) {
      const x = (stoneRandom() - 0.5) * 2 * 28;
      const z = (stoneRandom() - 0.5) * 2 * 28;
      const insideCourtyard =
        Math.abs(x) < COURTYARD_HALF + 0.4 && Math.abs(z) < COURTYARD_HALF + 0.4;
      const inRiver = Math.abs(z - RIVER_CENTER_Z) < RIVER_HALF_WIDTH + 0.1;
      const onBridge =
        Math.abs(x) < BRIDGE_HALF_WIDTH + 0.8 && z > BRIDGE_START_Z && z < BRIDGE_END_Z;
      if (insideCourtyard || inRiver || onBridge) continue;
      pushStone(x, z, 0.1 + stoneRandom() * 0.22);
    }

    const stoneGeo = new THREE.DodecahedronGeometry(1, 0);
    const stoneMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.95,
      metalness: 0.02,
      flatShading: true
    });
    const stoneMesh = new THREE.InstancedMesh(stoneGeo, stoneMat, stoneSpots.length);
    stoneMesh.name = 'stone-field';
    stoneMesh.castShadow = true;
    stoneMesh.receiveShadow = true;

    const stoneDummy = new THREE.Object3D();
    const stoneColor = new THREE.Color();
    stoneSpots.forEach((spot, i) => {
      stoneDummy.position.set(spot.x, spot.sy * 0.45, spot.z); // 半埋进地面
      stoneDummy.rotation.set(spot.rx, spot.ry, spot.rz);
      stoneDummy.scale.set(spot.sx, spot.sy, spot.sz);
      stoneDummy.updateMatrix();
      stoneMesh.setMatrixAt(i, stoneDummy.matrix);
      stoneMesh.setColorAt(i, stoneColor.setHex(spot.tone));
    });
    stoneMesh.instanceMatrix.needsUpdate = true;
    if (stoneMesh.instanceColor) stoneMesh.instanceColor.needsUpdate = true;
    stoneMesh.computeBoundingSphere?.();
    scene.add(stoneMesh);

    // ================= 粒子系统：白天樱花 / 夜晚萤火虫与星空 =================

    // 花瓣纹理：粉色渐变 + 顶部小缺口
    function createPetalTexture() {
      const size = 64;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#ffe6f0');
      grad.addColorStop(0.55, '#f7b6cf');
      grad.addColorStop(1, '#e58ab0');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(size / 2, size * 0.94);
      ctx.bezierCurveTo(size * 0.06, size * 0.68, size * 0.1, size * 0.16, size * 0.5, size * 0.1);
      ctx.bezierCurveTo(size * 0.9, size * 0.16, size * 0.94, size * 0.68, size / 2, size * 0.94);
      ctx.closePath();
      ctx.fill();

      // 顶端花瓣缺口
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.moveTo(size * 0.5, 0);
      ctx.lineTo(size * 0.41, size * 0.2);
      ctx.lineTo(size * 0.59, size * 0.2);
      ctx.closePath();
      ctx.fill();

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 萤火虫 / 星星共用的柔光点纹理
    function createGlowTexture() {
      const size = 64;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.25, 'rgba(255, 255, 255, 0.85)');
      grad.addColorStop(0.6, 'rgba(255, 255, 255, 0.28)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    class Particles {
      constructor() {
        this.group = new THREE.Group();
        this.group.name = 'particles';
        this.time = 0;
        this.wind = new THREE.Vector2(0.55, 0.22);
        this.random = makeRandom(90210);
        this._dummy = new THREE.Object3D();

        this._buildPetals();
        this._buildNightLights();

        scene.add(this.group);
      }

      _rand(min, max) {
        return min + this.random() * (max - min);
      }

      // ---------- 樱花花瓣（InstancedMesh，逐片旋转 + 阵风漂移） ----------
      _buildPetals() {
        this.petalCount = 260;
        this.petalMat = new THREE.MeshStandardMaterial({
          map: createPetalTexture(),
          transparent: true,
          opacity: 1,
          alphaTest: 0.12,
          side: THREE.DoubleSide,
          roughness: 0.78,
          metalness: 0,
          depthWrite: false
        });
        this.petals = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(1, 1),
          this.petalMat,
          this.petalCount
        );
        this.petals.name = 'cherry-petals';
        this.petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        this.petals.frustumCulled = false;
        this.petals.castShadow = false;
        this.petals.receiveShadow = false;

        this.petalData = [];
        for (let i = 0; i < this.petalCount; i++) {
          const petal = {};
          this._respawnPetal(petal, true);
          this.petalData.push(petal);
          this._writePetalMatrix(i, petal);
        }
        this.petals.instanceMatrix.needsUpdate = true;
        this.group.add(this.petals);
      }

      _respawnPetal(petal, initial) {
        // 与落叶一致：不要生成在别墅正上方，否则会飘进室内挡住镜头
        for (let attempt = 0; attempt < 8; attempt++) {
          petal.x = this._rand(-13.5, 13.5);
          petal.z = this._rand(-13.5, 13.5);
          if (Math.abs(petal.x) > 4.6 || Math.abs(petal.z) > 4.6) break;
        }
        petal.y = initial ? this._rand(0.3, 13) : this._rand(11, 14);
        petal.fall = this._rand(0.45, 0.95);
        petal.swayPhase = this._rand(0, Math.PI * 2);
        petal.swaySpeed = this._rand(0.7, 1.7);
        petal.swayAmpX = this._rand(0.18, 0.55);
        petal.swayAmpZ = this._rand(0.12, 0.4);
        petal.rotX = this._rand(0, Math.PI * 2);
        petal.rotY = this._rand(0, Math.PI * 2);
        petal.rotZ = this._rand(0, Math.PI * 2);
        petal.spinX = this._rand(-2.4, 2.4);
        petal.spinY = this._rand(-1.8, 1.8);
        petal.spinZ = this._rand(-2.0, 2.0);
        petal.scale = this._rand(0.13, 0.26);
      }

      _writePetalMatrix(index, petal) {
        this._dummy.position.set(petal.x, petal.y, petal.z);
        this._dummy.rotation.set(petal.rotX, petal.rotY, petal.rotZ);
        this._dummy.scale.setScalar(petal.scale);
        this._dummy.updateMatrix();
        this.petals.setMatrixAt(index, this._dummy.matrix);
      }

      _updatePetals(dt) {
        const t = this.time;
        // 阵风：两个不同频率的正弦叠加，避免机械式直线飘落
        const windX = 0.55 + 0.32 * Math.sin(t * 0.31) + 0.16 * Math.sin(t * 0.87 + 1.2);
        const windZ = 0.2 * Math.sin(t * 0.23 + 2.1) + 0.12 * Math.sin(t * 0.61);
        this.wind.set(windX, windZ);

        for (let i = 0; i < this.petalCount; i++) {
          const petal = this.petalData[i];
          const sway = Math.sin(t * petal.swaySpeed + petal.swayPhase);
          const sway2 = Math.cos(t * petal.swaySpeed * 0.8 + petal.swayPhase);

          petal.x += (windX + sway * petal.swayAmpX) * dt;
          petal.z += (windZ + sway2 * petal.swayAmpZ) * dt;
          petal.y -= (petal.fall + sway * 0.16) * dt;

          petal.rotX += petal.spinX * dt;
          petal.rotY += petal.spinY * dt;
          petal.rotZ += petal.spinZ * dt;

          // 飘进别墅室内 / 台基上方的花瓣直接回收，避免贴在半透明镜头前
          const insideVilla =
            Math.abs(petal.x) < 4.6 && Math.abs(petal.z) < 4.6 && petal.y < 9.6;

          if (
            petal.y < 0.05 ||
            insideVilla ||
            petal.x > 21 || petal.x < -21 ||
            petal.z > 21 || petal.z < -21
          ) {
            this._respawnPetal(petal, false);
          }

          this._writePetalMatrix(i, petal);
        }
        this.petals.instanceMatrix.needsUpdate = true;
      }

      // ---------- 夜间：萤火虫 + 星空 ----------
      _buildNightLights() {
        this._buildFireflies();
        this._buildStars();
      }

      _buildFireflies() {
        // 60 个暖黄小点：位置固定，只做很轻的上下漂浮与呼吸闪烁
        this.fireflyCount = CONFIG.counts.fireflies;
        const positions = new Float32Array(this.fireflyCount * 3);
        const colors = new Float32Array(this.fireflyCount * 3);
        this.fireflyData = [];

        for (let i = 0; i < this.fireflyCount; i++) {
          const angle = this._rand(0, Math.PI * 2);
          const radius = 4.6 + Math.sqrt(this.random()) * 3.6;
          const firefly = {
            bx: Math.cos(angle) * radius * 0.92,
            bz: Math.sin(angle) * radius,
            by: this._rand(0.5, 2.9),
            bob: this._rand(0.08, 0.22),
            speed: this._rand(0.35, 0.78),
            phase: this._rand(0, Math.PI * 2),
            // 闪烁频率比旧版更高：更像真萤火，而不是缓慢的呼吸灯
            flicker: this._rand(CONFIG.fireflies.flickerMin, CONFIG.fireflies.flickerMax),
            warm: this.random() > 0.16,
            curX: 0, curY: 0, curZ: 0, curFlick: 0
          };
          this.fireflyData.push(firefly);
          positions[i * 3] = firefly.bx;
          positions[i * 3 + 1] = firefly.by;
          positions[i * 3 + 2] = firefly.bz;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        this.fireflyMat = new THREE.PointsMaterial({
          size: 0.19,
          map: createGlowTexture(),
          transparent: true,
          opacity: 0,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexColors: true,
          sizeAttenuation: true
        });
        this.fireflies = new THREE.Points(geo, this.fireflyMat);
        this.fireflies.name = 'fireflies';
        this.fireflies.frustumCulled = false;
        this.fireflies.visible = false;
        this.group.add(this.fireflies);

        // 只跟随少量萤火虫的微光 PointLight：飞行时能轻轻照亮下方草地，
        // 数量受 CONFIG.fireflies.lightCount 控制，避免 60 盏点光拖垮性能。
        this.fireflyLights = [];
        this.fireflyLightIndices = [];
        const lightCount = Math.min(CONFIG.fireflies.lightCount, this.fireflyCount);
        for (let i = 0; i < lightCount; i++) {
          const light = new THREE.PointLight(
            CONFIG.fireflies.lightColor,
            0,
            CONFIG.fireflies.lightDistance,
            2
          );
          light.castShadow = false;
          light.visible = false;
          this.group.add(light);
          this.fireflyLights.push(light);
          this.fireflyLightIndices.push(
            Math.floor((i + 0.5) * this.fireflyCount / lightCount)
          );
        }
      }

      _updateFireflies(nightFade = 0) {
        const t = this.time;
        const pos = this.fireflies.geometry.attributes.position;
        const col = this.fireflies.geometry.attributes.color;

        for (let i = 0; i < this.fireflyCount; i++) {
          const f = this.fireflyData[i];
          // 横向漂移控制在 ±4cm，像壁纸一样安静；纵向做慢速正弦浮沉
          const x = f.bx + Math.sin(t * f.speed * 0.7 + f.phase) * 0.04;
          const z = f.bz + Math.cos(t * f.speed * 0.6 + f.phase * 1.3) * 0.04;
          const y = f.by + Math.sin(t * f.speed + f.phase) * f.bob;
          pos.setXYZ(i, x, y, z);
          f.curX = x;
          f.curY = y;
          f.curZ = z;

          // 呼吸式明暗：平方曲线让暗下去的时间更长，接近真实萤火
          const breath = 0.5 + 0.5 * Math.sin(t * f.flicker + f.phase * 2);
          const flick = 0.22 + 0.78 * breath * breath;
          f.curFlick = flick;
          const warm = f.warm;
          col.setXYZ(
            i,
            (warm ? 1.0 : 0.68) * flick,
            (warm ? 0.72 : 1.0) * flick,
            (warm ? 0.24 : 0.58) * flick
          );
        }
        pos.needsUpdate = true;
        col.needsUpdate = true;

        // 微光点光源跟随对应萤火虫，强度同步闪烁
        for (let k = 0; k < this.fireflyLights.length; k++) {
          const light = this.fireflyLights[k];
          const f = this.fireflyData[this.fireflyLightIndices[k]];
          light.position.set(f.curX, f.curY, f.curZ);
          light.intensity = nightFade * CONFIG.fireflies.lightIntensity * (0.35 + 0.65 * f.curFlick);
          light.visible = nightFade > 0.02;
        }
      }

      _buildStars() {
        this.starCount = CONFIG.counts.stars;
        const positions = new Float32Array(this.starCount * 3);
        const colors = new Float32Array(this.starCount * 3);
        const dist = 150;
        this.starData = [];

        for (let i = 0; i < this.starCount; i++) {
          // 只在上半球生成；约 40% 靠近地平线，保证默认俯视视角也能看到星点
          const y = i % 5 < 2 ? this._rand(0.012, 0.15) : this._rand(0.08, 1);
          const ring = Math.sqrt(1 - y * y);
          const theta = this._rand(0, Math.PI * 2);
          positions[i * 3] = Math.cos(theta) * ring * dist;
          positions[i * 3 + 1] = y * dist;
          positions[i * 3 + 2] = Math.sin(theta) * ring * dist;

          // 微蓝 / 微黄随机色，而不是一片死白
          const palette = CONFIG.stars.palette;
          const tint = palette[Math.floor(this.random() * palette.length)];
          const brightness = this._rand(CONFIG.stars.brightnessMin, CONFIG.stars.brightnessMax);
          colors[i * 3] = tint[0] * brightness;
          colors[i * 3 + 1] = tint[1] * brightness;
          colors[i * 3 + 2] = tint[2] * brightness;

          this.starData.push({
            r: tint[0],
            g: tint[1],
            b: tint[2],
            brightness,
            phase: this._rand(0, Math.PI * 2),
            speed: this._rand(CONFIG.stars.twinkleSpeedMin, CONFIG.stars.twinkleSpeedMax)
          });
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        this.starMat = new THREE.PointsMaterial({
          size: CONFIG.stars.size,      // 1.7px：细碎的星点，不再是白色大圆斑
          map: createGlowTexture(),
          transparent: true,
          opacity: 0,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexColors: true,
          sizeAttenuation: false,
          fog: false
        });
        this.stars = new THREE.Points(geo, this.starMat);
        this.stars.name = 'stars';
        this.stars.frustumCulled = false;
        this.stars.visible = false;
        this.group.add(this.stars);
      }

      // 星星轻微闪烁：用正弦扰动顶点色，亮度在基础值上下浮动
      _updateStars(nightFade) {
        if (nightFade <= 0.01) return;
        const t = this.time;
        const col = this.stars.geometry.attributes.color;
        const depth = CONFIG.stars.twinkleDepth;

        for (let i = 0; i < this.starCount; i++) {
          const star = this.starData[i];
          const twinkle = 1 - depth + depth * (0.5 + 0.5 * Math.sin(t * star.speed + star.phase));
          const b = star.brightness * twinkle;
          col.setXYZ(i, star.r * b, star.g * b, star.b * b);
        }
        col.needsUpdate = true;
      }

      // 每帧更新：樱花 → 萤火虫 + 星空 的交叉淡入淡出
      update(dt, nightMix) {
        this.time += dt;
        this._updatePetals(dt);

        const petalFade = 1 - THREE.MathUtils.smoothstep(nightMix, 0.1, 0.75);
        this.petalMat.opacity = petalFade;
        this.petals.visible = petalFade > 0.01;

        const nightFade = THREE.MathUtils.smoothstep(nightMix, 0.25, 0.9);
        this.fireflyMat.opacity = nightFade;
        this.fireflies.visible = nightFade > 0.01;
        this.starMat.opacity = nightFade;
        this.stars.visible = nightFade > 0.01;

        // 先算好 nightFade，再驱动萤火虫的微光点光源
        if (nightFade > 0.01) {
          this._updateFireflies(nightFade);
          this._updateStars(nightFade);
        }

        this.stars.rotation.y += dt * 0.008;
      }
    }

    // ---------- 天空飘落的树叶 / 花瓣：FALLING_LEAF_COUNT 片小面片 ----------
    // 与樱花区分：更小、更缓、颜色在粉色与浅黄之间，落在草地 / 河面上方后回到天空。
    class FallingLeaves {
      constructor() {
        this.count = FALLING_LEAF_COUNT;
        this.random = makeRandom(31415926);
        this.time = 0;

        this.material = new THREE.MeshStandardMaterial({
          map: createPetalTexture(), // 复用花瓣轮廓，避免出现方形纸片
          color: 0xffffff, // instanceColor 提供粉色 / 浅黄，昼夜由材质整体染色
          roughness: 0.85,
          metalness: 0,
          side: THREE.DoubleSide,
          transparent: true,
          depthWrite: false,
          alphaTest: 0.12
        });
        this.mesh = new THREE.InstancedMesh(
          new THREE.PlaneGeometry(1, 1),
          this.material,
          this.count
        );
        this.mesh.name = 'falling-leaves';
        this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        this.mesh.frustumCulled = false;
        this.mesh.castShadow = false;
        this.mesh.receiveShadow = false;

        this._dummy = new THREE.Object3D();
        this._color = new THREE.Color();
        this.leaves = [];
        const tones = [0xffc2d8, 0xffe6a8, 0xfff3c4, 0xf7a8c4];

        for (let i = 0; i < this.count; i++) {
          const leaf = {};
          this._respawn(leaf, true);
          this.leaves.push(leaf);
          this.mesh.setColorAt(i, this._color.setHex(tones[i % tones.length]));
          this._write(i, leaf);
        }
        this.mesh.instanceMatrix.needsUpdate = true;
        if (this.mesh.instanceColor) this.mesh.instanceColor.needsUpdate = true;
        scene.add(this.mesh);
      }

      _rand(min, max) {
        return min + this.random() * (max - min);
      }

      _respawn(leaf, initial) {
        // 花瓣可以飘在院子里，但不要生成在别墅上方（否则会落进室内）
        for (let attempt = 0; attempt < 8; attempt++) {
          leaf.x = this._rand(-17, 17);
          leaf.z = this._rand(-17, 17);
          if (Math.abs(leaf.x) > 4.6 || Math.abs(leaf.z) > 4.6) break;
        }
        leaf.y = initial ? this._rand(1, 15) : this._rand(13, 17); // 回到天空
        leaf.fall = this._rand(0.35, 0.75);
        leaf.swayPhase = this._rand(0, Math.PI * 2);
        leaf.swaySpeed = this._rand(0.5, 1.3);
        leaf.swayAmp = this._rand(0.2, 0.55);
        leaf.rotX = this._rand(0, Math.PI * 2);
        leaf.rotY = this._rand(0, Math.PI * 2);
        leaf.rotZ = this._rand(0, Math.PI * 2);
        leaf.spinX = this._rand(-2.0, 2.0);
        leaf.spinY = this._rand(-1.6, 1.6);
        leaf.spinZ = this._rand(-1.8, 1.8);
        leaf.size = this._rand(0.08, 0.16);
      }

      _write(index, leaf) {
        this._dummy.position.set(leaf.x, leaf.y, leaf.z);
        this._dummy.rotation.set(leaf.rotX, leaf.rotY, leaf.rotZ);
        this._dummy.scale.set(leaf.size, leaf.size * 1.6, leaf.size);
        this._dummy.updateMatrix();
        this.mesh.setMatrixAt(index, this._dummy.matrix);
      }

      update(dt) {
        this.time += dt;
        const windX = 0.32 + 0.22 * Math.sin(this.time * 0.31);
        const windZ = 0.12 + 0.14 * Math.sin(this.time * 0.47 + 1.4);

        for (let i = 0; i < this.count; i++) {
          const leaf = this.leaves[i];
          const sway = Math.sin(this.time * leaf.swaySpeed + leaf.swayPhase);

          leaf.x += (windX + sway * leaf.swayAmp) * dt;
          leaf.z += windZ * dt;
          leaf.y -= (leaf.fall + sway * 0.08) * dt;

          leaf.rotX += leaf.spinX * dt;
          leaf.rotY += leaf.spinY * dt;
          leaf.rotZ += leaf.spinZ * dt;

          // 飘进别墅室内 / 台基上方的花瓣直接回收，避免半透明花瓣贴在镜头前
          const insideVilla =
            Math.abs(leaf.x) < 4.6 && Math.abs(leaf.z) < 4.6 && leaf.y < 9.6;

          if (
            leaf.y < 0.04 ||
            insideVilla ||
            leaf.x > 20 || leaf.x < -20 ||
            leaf.z > 20 || leaf.z < -20
          ) {
            this._respawn(leaf, false);
          }
          this._write(i, leaf);
        }
        this.mesh.instanceMatrix.needsUpdate = true;
      }
    }

    const particles = new Particles();
    const fallingLeaves = new FallingLeaves();


    // ---------- 楼层分层显示交互 ----------
    // 只选择带 data-floor 的按钮，避免把昼夜切换按钮卷进来
    const floorButtons = document.querySelectorAll('.floor-btn[data-floor]');

    // 当前被单独查看的楼层（null 表示显示全部）
    let cutawayFloor = null;
    const xrayBtn = document.getElementById('xray-btn');
    let xrayEnabled = false;

    function setLabelVisible(label, visible) {
      if (!label) return;
      label.visible = visible;
      // CSS2D 标签是真实 DOM，必须同步 display，否则 group.visible 不会隐藏它们
      if (label.element) label.element.style.display = visible ? '' : 'none';
    }

    // 只把外墙材质切到半透明；隔断 / 楼板 / 楼梯 / 家具保持完全实体
    function applyWallAppearance() {
      const cutaway = cutawayFloor !== null;
      const opacity = xrayEnabled
        ? CONFIG.xray.wallOpacity
        : (cutaway ? 0.05 : 1);

      wallMat.opacity = opacity;
      wallMat.transparent = opacity < 1;
      wallMat.depthWrite = opacity >= 1;
      wallMat.needsUpdate = true;

      outerWallMeshes.forEach((mesh) => {
        const isCut = cutaway && mesh.userData.floorIndex === cutawayFloor;
        // 半透明墙体再投射阴影会把室内压黑，透视 / 剖切时统一关闭
        mesh.castShadow = !isCut && !xrayEnabled;
      });
    }

    function setXray(enabled) {
      xrayEnabled = Boolean(enabled);
      xrayBtn.classList.toggle('is-active', xrayEnabled);
      xrayBtn.setAttribute('aria-pressed', String(xrayEnabled));
      xrayBtn.textContent = xrayEnabled ? '👁️ 恢复实体墙' : '👁️ 透视墙体';
      document.documentElement.dataset.xray = xrayEnabled ? '1' : '0';
      applyWallAppearance();
    }

    xrayBtn.addEventListener('click', () => setXray(!xrayEnabled));

    // onlyIndex 为 0/1/2 时只显示该层，为 null 时显示全部
    function showOnlyFloor(onlyIndex) {
      cutawayFloor = onlyIndex;
      const cutaway = onlyIndex !== null;

      floorGroups.forEach((group, i) => {
        const visible = !cutaway || i === onlyIndex;
        group.visible = visible;

        // 核心联动：标签随楼层一起显示 / 隐藏，避免视线穿模
        setLabelVisible(floorLabels[i], visible);
        for (const label of extraFloorLabels[i]) setLabelVisible(label, visible);

        group.traverse((obj) => {
          if (!obj.isMesh) return;
          // 剖切层把屋面板换成半透明材质，否则俯视时屋顶会挡住室内家具
          if (obj.userData.isRoofPanel) {
            const isCut = cutaway && i === onlyIndex;
            obj.material = isCut ? ghostRoofMat : obj.userData.roofMaterial;
            obj.castShadow = !isCut;
          }
          // 当前层顶板隐藏，才能从上方看进室内；其余楼层顶板保持
          if (obj.userData.isCeilingSlab) {
            obj.visible = !(cutaway && i === onlyIndex);
          }
        });

        // 室内暖光：单独查看时加强，其余楼层熄灭；回到“全部”时按昼夜恢复
        if (interiorLights[i]) {
          if (!cutaway) {
            interiorLights[i].intensity = Math.max(
              interiorDayIntensity[i],
              nightMix * interiorNightIntensity[i]
            );
          } else if (i === onlyIndex) {
            interiorLights[i].intensity = CONFIG.lights.interiorCutaway + nightMix * 2.5;
          } else {
            interiorLights[i].intensity = 0;
          }
        }
      });

      // 单层查看时白墙更淡，露出客厅 / 卧室 / 书房与楼梯
      applyWallAppearance();
    }

    floorButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.floor;
        showOnlyFloor(key === 'all' ? null : Number(key) - 1);

        floorButtons.forEach((other) => {
          const isActive = other === btn;
          other.classList.toggle('is-active', isActive);
          other.setAttribute('aria-pressed', String(isActive));
        });
      });
    });

    // ================= 第一人称漫游 =================
    // 设计要点：
    // 1) 视点高度固定 1.7m，只在 XZ 平面移动，抬头 / 低头不影响脚下高度；
    // 2) 庭院矩形 + 院门走廊边界（各收进一个人体半径）+ 别墅台基 AABB，保证不会穿墙 / 穿围栏；
    // 3) 额外向前方打一条胸口高度的射线，检测灌木、树干等细节障碍。

    const EYE_HEIGHT = 1.7;          // 视点高度（米）
    const ROAM_RADIUS = 0.38;        // 人体碰撞半径（米）
    const ROAM_WALK_SPEED = 2.8;     // 步行速度（米 / 秒）
    const ROAM_RUN_SPEED = 5.0;      // 按住 Shift 的奔跑速度
    const ROAM_ACCEL = 12;           // 速度阻尼系数，越大起步 / 停步越干脆
    const ROAM_RAY_HEIGHT = 0.95;    // 射线高度：胸口位置，能扫到围栏与灌木
    const ROAM_FOV = 62;             // 第一人称更接近人眼的视野，退出时恢复 42°
    const ROAM_START = new THREE.Vector3(0, EYE_HEIGHT, 12.2); // 院门外的石径起点
    const ROAM_START_PITCH = 0.14;   // 略微抬头，看清门头与屋顶（弧度）

    const roamBtn = document.getElementById('roam-btn');
    const roamCrosshair = document.getElementById('roam-crosshair');
    const roamHint = document.getElementById('roam-hint');

    // 按键状态表：keydown 置 true，keyup / 退出漫游 / 失焦时清零
    const keys = {
      KeyW: false,
      KeyA: false,
      KeyS: false,
      KeyD: false,
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
      ShiftLeft: false,
      ShiftRight: false
    };

    let roamActive = false;          // 是否处于漫游模式（相机已接管）
    let roamLocked = false;          // 浏览器是否真的锁定了指针
    const roamVelocity = new THREE.Vector3();
    const roamForward = new THREE.Vector3();
    const roamRight = new THREE.Vector3();
    const roamWish = new THREE.Vector3();
    const roamRaycaster = new THREE.Raycaster();
    const roamRayOrigin = new THREE.Vector3();
    const roamRayDirection = new THREE.Vector3();

    // 进入漫游前的上帝视角，退出时原样恢复
    const orbitSnapshot = {
      position: new THREE.Vector3(),
      target: new THREE.Vector3(),
      fov: camera.fov
    };

    // 庭院矩形移动边界（向内收人体半径 + 0.12m 安全距离）
    const ROAM_BOUNDS = {
      minX: -COURTYARD_HALF + ROAM_RADIUS + 0.12,
      maxX: COURTYARD_HALF - ROAM_RADIUS - 0.12,
      minZ: -COURTYARD_HALF + ROAM_RADIUS + 0.12,
      maxZ: COURTYARD_HALF - ROAM_RADIUS - 0.12
    };

    // 院门走廊 + 木桥通道：走出院门后沿石径上桥，可一直走到对岸
    const ROAM_GATE = {
      minX: -GATE_HALF + ROAM_RADIUS,
      maxX: GATE_HALF - ROAM_RADIUS,
      maxZ: BRIDGE_END_Z + 0.9
    };

    // 别墅台基 7.9m 见方；不再整块阻挡，改为按台基 / 台阶 / 楼板高度采样
    const ROAM_BASE_TOP = BASE_Y;
    const ROAM_BASE_HALF = 7.9 / 2;
    const ROAM_ENTRY_STEP = { top: 0.14, minZ: 3.9, maxZ: 4.6, halfX: 1.2 };
    const ROAM_STEP_UP = 0.45;    // 最大上台阶高度（14cm 台阶 + 6cm 室内地面）
    const ROAM_STEP_DOWN = 0.55;  // 最大下落高度，超过就当作踏空并禁止移动
    const ROAM_DOOR_PASS = 0.34;  // 入户门可通行的半宽（门洞 1.2m）

    // 每层室内地面高度与内轮廓，和建模用的 tiers / WALL_T 保持一致
    let roamLevelY = BASE_Y;
    const ROAM_FLOORS = tiers.map((tier, index) => {
      const floor = {
        index,
        y: roamLevelY + 0.06,
        halfX: tier.w / 2 - WALL_T,
        halfZ: tier.d / 2 - WALL_T
      };
      roamLevelY += tier.h;
      return floor;
    });

    const ROAM_STAIR_RUN = STAIR.zBottom - STAIR.zTop;
    const ROAM_STAIR_RISE = STAIR.topY - STAIR.baseY;

    function roamStairY(z) {
      const t = THREE.MathUtils.clamp((STAIR.zBottom - z) / ROAM_STAIR_RUN, 0, 1);
      return STAIR.baseY + t * ROAM_STAIR_RISE;
    }

    function onStairFootprint(x, z) {
      return (
        x >= STAIR.xMin && x <= STAIR.xMax &&
        z >= STAIR.zTop && z <= STAIR.zBottom
      );
    }

    // 脚下可站立的高度；null 表示这里没有落脚面（例如楼梯井上方）
    function sampleRoamGround(x, z, feetY) {
      const minY = feetY - ROAM_STEP_DOWN;
      const maxY = feetY + ROAM_STEP_UP;
      const take = (y) => (y >= minY && y <= maxY ? y : null);

      // 楼梯是实心踏步：只有坡道面可站，脚下没有一楼地面
      if (onStairFootprint(x, z)) return take(roamStairY(z));

      let best = take(0); // 庭院 / 石桥地面

      if (Math.abs(x) <= ROAM_BASE_HALF && Math.abs(z) <= ROAM_BASE_HALF) {
        const baseY = take(ROAM_BASE_TOP);
        if (baseY !== null) best = Math.max(best === null ? -Infinity : best, baseY);
      }

      if (
        Math.abs(x) <= ROAM_ENTRY_STEP.halfX &&
        z >= ROAM_ENTRY_STEP.minZ && z <= ROAM_ENTRY_STEP.maxZ
      ) {
        const stepY = take(ROAM_ENTRY_STEP.top);
        if (stepY !== null) best = Math.max(best === null ? -Infinity : best, stepY);
      }

      for (const floor of ROAM_FLOORS) {
        if (Math.abs(x) > floor.halfX || Math.abs(z) > floor.halfZ) continue;
        // 二楼楼梯洞口：洞口范围内没有楼板
        if (
          floor.index === 1 &&
          x >= STAIR.hole.minX && x <= STAIR.hole.maxX &&
          z >= STAIR.hole.minZ && z <= STAIR.hole.maxZ
        ) {
          continue;
        }
        const y = take(floor.y);
        if (y !== null) best = Math.max(best === null ? -Infinity : best, y);
      }

      return best;
    }

    // 当前高度对应的楼层（上楼梯到 2.7m 以上就按二楼判断墙体）
    function activeRoamFloor(feetY) {
      let active = 0;
      for (const floor of ROAM_FLOORS) {
        if (feetY >= floor.y - 0.42) active = floor.index;
      }
      return active;
    }

    // 外墙洞口检查：窗洞不可穿越，入户门可以；楼梯贴着二楼东墙，不做带宽检查
    function isBlockedByRoamWalls(x, z, feetY) {
      if (onStairFootprint(x, z)) return false;

      const tier = tiers[activeRoamFloor(feetY)];
      const halfW = tier.w / 2;
      const halfD = tier.d / 2;
      const pad = WALL_T / 2 + ROAM_RADIUS;

      if (Math.abs(x) <= halfW + pad) {
        for (const sz of [-1, 1]) {
          if (Math.abs(z - sz * (halfD - WALL_T / 2)) >= pad) continue;
          if (tier === tiers[0] && sz === 1 && Math.abs(x) <= ROAM_DOOR_PASS) continue;
          return true;
        }
      }
      if (Math.abs(z) <= halfD + pad) {
        for (const sx of [-1, 1]) {
          if (Math.abs(x - sx * (halfW - WALL_T / 2)) < pad) return true;
        }
      }
      return false;
    }

    // 庭院四角灌木，坐标与上方创建灌木时保持一致
    const ROAM_BUSH_BOXES = [
      [-6.2, 5.6], [6.2, 5.6], [-6.2, -5.8], [6.2, -5.8]
    ].map(([x, z]) => ({
      minX: x - 0.58 - ROAM_RADIUS,
      maxX: x + 0.58 + ROAM_RADIUS,
      minZ: z - 0.58 - ROAM_RADIUS,
      maxZ: z + 0.58 + ROAM_RADIUS
    }));

    // 前向射线的碰撞目标：别墅实体 + 围栏 + 树木；跳过玻璃，避免“透明墙”挡路
    const roamRayTargets = [];
    for (const root of [villa, fenceGroup, treeGroup]) {
      root.traverse((obj) => {
        if (!obj.isMesh) return;
        if (obj.material === glassMat || obj.material === fenceGlassMat) return;
        roamRayTargets.push(obj);
      });
    }
    // 外部 GLTF 模型同样参与漫游碰撞：补登记初始化期间已加载完的模型，
    // 之后加载的模型会在 loadModel() 的成功回调里直接 push。
    roamRayTargets.push(...externalModelMeshes);

    // 楼梯踏步由脚下高度采样处理：若继续当作前向障碍，上楼时会被前方的踏步挡住
    for (const step of stairStepMeshes) {
      const index = roamRayTargets.indexOf(step);
      if (index >= 0) roamRayTargets.splice(index, 1);
    }
    roamRayTargetsReady = true;

    // 室内隔断的 AABB：按玩家身体高度判断，保留门洞（隔断本身已分段建模）
    const roamWallBoxes = interiorWallMeshes.map((mesh) => {
      const box = new THREE.Box3().setFromObject(mesh);
      return {
        minX: box.min.x,
        maxX: box.max.x,
        minY: box.min.y,
        maxY: box.max.y,
        minZ: box.min.z,
        maxZ: box.max.z
      };
    });

    function isBlockedByInterior(x, z, feetY) {
      const bodyMin = feetY + 0.15;
      const bodyMax = feetY + EYE_HEIGHT - 0.1;
      for (const box of roamWallBoxes) {
        if (bodyMax < box.minY || bodyMin > box.maxY) continue;
        if (
          x > box.minX - ROAM_RADIUS && x < box.maxX + ROAM_RADIUS &&
          z > box.minZ - ROAM_RADIUS && z < box.maxZ + ROAM_RADIUS
        ) {
          return true;
        }
      }
      return false;
    }

    function resetRoamInput() {
      for (const code of Object.keys(keys)) keys[code] = false;
      roamVelocity.set(0, 0, 0);
    }

    function setRoamUI(active) {
      roamBtn.classList.toggle('is-active', active);
      roamBtn.setAttribute('aria-pressed', String(active));
      roamBtn.setAttribute(
        'aria-label',
        active ? '退出第一人称漫游模式' : '进入第一人称漫游模式'
      );
      roamBtn.textContent = active ? '🚶 退出漫游' : '🚶 漫游模式';
      roamCrosshair.classList.toggle('is-visible', active && roamLocked);
      roamHint.classList.toggle('is-visible', active && roamLocked);
      document.documentElement.dataset.roamActive = active ? '1' : '0';
    }

    function enterRoam() {
      if (roamActive) return;

      // 保存上帝视角
      orbitSnapshot.position.copy(camera.position);
      orbitSnapshot.target.copy(controls.target);
      orbitSnapshot.fov = camera.fov;

      roamActive = true;
      resetRoamInput();

      // 关闭轨道控制，启用指针锁定控制
      controls.enabled = false;
      fpControls.enabled = true;
      setRoamUI(true);

      // 从院门外开始，面朝别墅（-Z），略微抬头
      camera.position.copy(ROAM_START);
      camera.rotation.set(ROAM_START_PITCH, 0, 0, 'YXZ');
      camera.up.set(0, 1, 0);
      camera.fov = ROAM_FOV;
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();

      roamBtn.blur(); // 防止焦点留在按钮上，空格键误触退出
      fpControls.lock(); // 必须由用户手势（按钮点击）触发
    }

    function exitRoam() {
      if (!roamActive) return;

      roamActive = false;
      resetRoamInput();

      // 恢复轨道控制
      fpControls.enabled = false;
      controls.enabled = true;
      setRoamUI(false);

      // 相机回到进入漫游前的位置、观察点与视野
      camera.position.copy(orbitSnapshot.position);
      camera.up.set(0, 1, 0);
      camera.fov = orbitSnapshot.fov;
      camera.updateProjectionMatrix();
      controls.target.copy(orbitSnapshot.target);
      controls.update();

      // 兜底：非 ESC 的退出路径也主动释放指针锁
      if (document.pointerLockElement === renderer.domElement) {
        fpControls.unlock();
      }
    }

    function toggleRoam() {
      if (roamActive) exitRoam();
      else enterRoam();
    }

    roamBtn.addEventListener('click', toggleRoam);

    // 以浏览器真实的指针锁定状态为准
    fpControls.addEventListener('lock', () => {
      roamLocked = true;
      setRoamUI(roamActive);
    });

    fpControls.addEventListener('unlock', () => {
      roamLocked = false;
      // ESC / 浏览器强制解锁 → 回到上帝视角
      exitRoam();
    });

    // 指针锁定失败（例如 ESC 后 1 秒内立即再次请求）时回退
    document.addEventListener('pointerlockerror', () => {
      if (roamActive) exitRoam();
    });

    // 按键状态：keydown 置位、keyup 复位，避免按键粘滞
    window.addEventListener('keydown', (event) => {
      if (event.code === 'Escape' && roamActive) {
        exitRoam();
        return;
      }
      if (!roamActive) return;
      if (!Object.hasOwn(keys, event.code)) return;
      keys[event.code] = true;
      event.preventDefault();
    });

    window.addEventListener('keyup', (event) => {
      if (Object.hasOwn(keys, event.code)) keys[event.code] = false;
    });

    // 切出窗口 / 标签页时清空按键，回来后不会继续“自动走”
    window.addEventListener('blur', resetRoamInput);

    function isBlockedAt(x, z, feetY) {
      // 庭院矩形 + 院门走廊：两个矩形的并集就是可行走区域
      const inCourtyard =
        x >= ROAM_BOUNDS.minX && x <= ROAM_BOUNDS.maxX &&
        z >= ROAM_BOUNDS.minZ && z <= ROAM_BOUNDS.maxZ;
      const inGatePath =
        x >= ROAM_GATE.minX && x <= ROAM_GATE.maxX &&
        z > ROAM_BOUNDS.maxZ && z <= ROAM_GATE.maxZ;
      if (!inCourtyard && !inGatePath) return true;

      // 桥面走廊收窄：栏杆以外是河水，不能直接横穿出去
      if (z > BRIDGE_START_Z - 0.4 && z <= BRIDGE_END_Z + 0.4) {
        if (Math.abs(x) > BRIDGE_HALF_WIDTH - 0.42) return true;
      }

      // 别墅：外墙窗洞 / 门洞、室内隔断、楼板与楼梯高度
      if (isBlockedByRoamWalls(x, z, feetY)) return true;
      if (isBlockedByInterior(x, z, feetY)) return true;
      if (sampleRoamGround(x, z, feetY) === null) return true;

      // 四角灌木
      for (const box of ROAM_BUSH_BOXES) {
        if (x > box.minX && x < box.maxX && z > box.minZ && z < box.maxZ) return true;
      }
      return false;
    }

    // 前方射线：本次脚步长度内有实体就阻止这次位移
    function hasObstacleAhead(dx, dz) {
      const distance = Math.hypot(dx, dz);
      if (distance < 1e-5) return false;

      roamRayDirection.set(dx / distance, 0, dz / distance);
      roamRaycaster.set(
        roamRayOrigin.set(
          camera.position.x,
          camera.position.y - EYE_HEIGHT + ROAM_RAY_HEIGHT,
          camera.position.z
        ),
        roamRayDirection
      );
      roamRaycaster.near = 0;
      roamRaycaster.far = ROAM_RADIUS + distance;

      const hits = roamRaycaster.intersectObjects(roamRayTargets, false);
      return hits.length > 0;
    }

    function moveRoamAxis(axis, delta) {
      if (Math.abs(delta) < 1e-6) return;

      const dx = axis === 'x' ? delta : 0;
      const dz = axis === 'z' ? delta : 0;
      const nextX = camera.position.x + dx;
      const nextZ = camera.position.z + dz;
      const feetY = camera.position.y - EYE_HEIGHT;

      if (isBlockedAt(nextX, nextZ, feetY) || hasObstacleAhead(dx, dz)) {
        roamVelocity[axis] *= 0.25; // 抵住障碍后迅速收速，避免贴墙抖动
        return;
      }

      camera.position.x = nextX;
      camera.position.z = nextZ;
    }

    function updateRoam(dt) {
      const step = Math.min(dt, 0.05);

      // 根据相机四元数求水平前进 / 右方向（pitch 压平）
      roamForward.set(0, 0, -1).applyQuaternion(camera.quaternion);
      roamForward.y = 0;
      if (roamForward.lengthSq() < 1e-6) roamForward.set(0, 0, -1);
      roamForward.normalize();

      roamRight.set(1, 0, 0).applyQuaternion(camera.quaternion);
      roamRight.y = 0;
      if (roamRight.lengthSq() < 1e-6) roamRight.set(1, 0, 0);
      roamRight.normalize();

      const forwardInput =
        (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const rightInput =
        (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);

      roamWish
        .set(0, 0, 0)
        .addScaledVector(roamForward, forwardInput)
        .addScaledVector(roamRight, rightInput);
      if (roamWish.lengthSq() > 1) roamWish.normalize();

      // 指数阻尼：不同帧率下加减速手感一致
      const speed = keys.ShiftLeft || keys.ShiftRight ? ROAM_RUN_SPEED : ROAM_WALK_SPEED;
      const damping = 1 - Math.exp(-ROAM_ACCEL * step);
      roamVelocity.x += (roamWish.x * speed - roamVelocity.x) * damping;
      roamVelocity.z += (roamWish.z * speed - roamVelocity.z) * damping;
      if (roamWish.lengthSq() === 0 && roamVelocity.lengthSq() < 1e-4) {
        roamVelocity.set(0, 0, 0);
      }

      // 分轴移动：贴着墙或围栏时可以顺着障碍滑动
      moveRoamAxis('x', roamVelocity.x * step);
      moveRoamAxis('z', roamVelocity.z * step);

      // 视点跟随脚下地面：台基 / 台阶 / 一楼地面 / 楼梯坡道 / 二三层楼板
      const feetY = camera.position.y - EYE_HEIGHT;
      const groundY = sampleRoamGround(camera.position.x, camera.position.z, feetY);
      if (groundY !== null) camera.position.y = groundY + EYE_HEIGHT;
    }

    // ================= 昼夜光照切换 =================
    // 两套光照预设：切换时按 nightMix（0=白天，1=夜晚）在渲染循环里平滑插值
    // 所有颜色与强度都从 CONFIG 读取，调参只需改文件顶部的 CONFIG。
    const DAY = {
      background: new THREE.Color(CONFIG.colors.day.background),
      fog: new THREE.Color(CONFIG.colors.day.fog),
      ground: new THREE.Color(CONFIG.colors.day.ground),
      courtyardGround: new THREE.Color(CONFIG.colors.day.courtyardGround),
      courtyardPath: new THREE.Color(CONFIG.colors.day.courtyardPath),
      meadow: new THREE.Color(CONFIG.colors.day.meadow),
      river: new THREE.Color(CONFIG.colors.day.river),
      riverBank: new THREE.Color(CONFIG.colors.day.riverBank),
      grassTint: new THREE.Color(CONFIG.colors.day.grassTint),
      shrubTint: new THREE.Color(CONFIG.colors.day.shrubTint),
      stoneTint: new THREE.Color(CONFIG.colors.day.stoneTint),
      bridgeWood: new THREE.Color(CONFIG.colors.day.bridgeWood),
      bridgeDark: new THREE.Color(CONFIG.colors.day.bridgeDark),
      leafTint: new THREE.Color(CONFIG.colors.day.leafTint),
      wall: new THREE.Color(CONFIG.colors.day.wall),
      roof: new THREE.Color(CONFIG.colors.day.roof),
      roofSlab: new THREE.Color(CONFIG.colors.day.roofSlab),
      trim: new THREE.Color(CONFIG.colors.day.trim),
      ambientColor: new THREE.Color(CONFIG.colors.day.ambient),
      ambientIntensity: CONFIG.lights.ambientDay,
      hemiSky: new THREE.Color(CONFIG.colors.day.hemiSky),
      hemiGround: new THREE.Color(CONFIG.colors.day.hemiGround),
      hemiIntensity: CONFIG.lights.hemiDay,
      sunColor: new THREE.Color(CONFIG.colors.day.sun),
      sunIntensity: CONFIG.lights.sunDay,
      sunPosition: new THREE.Vector3(14, 20, 10),
      rimColor: new THREE.Color(CONFIG.colors.day.rim),
      rimIntensity: CONFIG.lights.rimDay,
      glassOpacity: CONFIG.materials.glassOpacity,
      glassEmissiveIntensity: CONFIG.materials.glassEmissiveDay,
      windowLightIntensity: CONFIG.lights.windowDay,
      exposure: CONFIG.exposure.day,
      environmentIntensity: CONFIG.lights.environmentDay
    };

    const NIGHT = {
      background: new THREE.Color(CONFIG.colors.night.background), // 深空蓝，给星点与暖窗留出对比
      fog: new THREE.Color(CONFIG.colors.night.fog),
      ground: new THREE.Color(CONFIG.colors.night.ground),
      courtyardGround: new THREE.Color(CONFIG.colors.night.courtyardGround),
      courtyardPath: new THREE.Color(CONFIG.colors.night.courtyardPath), // 月光下的冷灰石板
      meadow: new THREE.Color(CONFIG.colors.night.meadow),
      river: new THREE.Color(CONFIG.colors.night.river),
      riverBank: new THREE.Color(CONFIG.colors.night.riverBank),
      grassTint: new THREE.Color(CONFIG.colors.night.grassTint), // 月光把草染成冷绿，而不是一片黑
      shrubTint: new THREE.Color(CONFIG.colors.night.shrubTint),
      stoneTint: new THREE.Color(CONFIG.colors.night.stoneTint),
      bridgeWood: new THREE.Color(CONFIG.colors.night.bridgeWood),
      bridgeDark: new THREE.Color(CONFIG.colors.night.bridgeDark),
      leafTint: new THREE.Color(CONFIG.colors.night.leafTint),
      wall: new THREE.Color(CONFIG.colors.night.wall),          // 白墙转为冷调
      roof: new THREE.Color(CONFIG.colors.night.roof),
      roofSlab: new THREE.Color(CONFIG.colors.night.roofSlab),  // 保留黛瓦贴图本色，由冷光染色
      trim: new THREE.Color(CONFIG.colors.night.trim),
      ambientColor: new THREE.Color(CONFIG.colors.night.ambient),
      ambientIntensity: CONFIG.lights.ambientNight,             // 冷调基础光，避免死黑
      hemiSky: new THREE.Color(CONFIG.colors.night.hemiSky),
      hemiGround: new THREE.Color(CONFIG.colors.night.hemiGround),
      hemiIntensity: CONFIG.lights.hemiNight,
      sunColor: new THREE.Color(CONFIG.colors.night.sun),       // 更冷的蓝月光
      sunIntensity: CONFIG.lights.sunNight,                     // 月光克制：水面已是漫反射，不会聚成光球
      sunPosition: new THREE.Vector3(-16, 18, 14),              // 换到另一侧，仍照亮正面
      rimColor: new THREE.Color(CONFIG.colors.night.rim),
      rimIntensity: CONFIG.lights.rimNight,
      glassOpacity: CONFIG.materials.glassNightOpacity,
      glassEmissiveIntensity: CONFIG.materials.glassEmissiveNight, // 暖窗越过 Bloom 阈值，但不过曝
      windowLightIntensity: CONFIG.lights.windowNight,          // 窗内灯光在墙上形成的克制光晕
      exposure: CONFIG.exposure.night,
      environmentIntensity: CONFIG.lights.environmentNight      // 夜里几乎关掉 HDR 反射，消灭水面光斑
    };

    const dayNightBtn = document.getElementById('daynight-btn');
    let isNight = false;
    let nightMix = 0; // 当前过渡进度：0 = 白天，1 = 夜晚

    dayNightBtn.addEventListener('click', () => {
      isNight = !isNight;
      dayNightBtn.classList.toggle('is-night', isNight);
      dayNightBtn.setAttribute('aria-pressed', String(isNight));
      dayNightBtn.setAttribute(
        'aria-label',
        isNight ? '当前为夜晚，切换到白天' : '当前为白天，切换到夜晚'
      );
      dayNightBtn.textContent = isNight ? '☀️ 切换到白天' : '🌙 切换到夜晚';
    });

    // dt 为秒；指数阻尼保证不同帧率下过渡时长一致（约 1 秒完成）
    function updateDayNight(dt) {
      const target = isNight ? 1 : 0;
      nightMix += (target - nightMix) * (1 - Math.exp(-4.5 * dt));
      if (Math.abs(target - nightMix) < 0.0005) nightMix = target;

      const t = nightMix;

      scene.background.copy(DAY.background).lerp(NIGHT.background, t);
      // 雾色与密度都来自 CONFIG：白天轻薄，夜晚浓成深蓝
      scene.fog.color.copy(DAY.fog).lerp(NIGHT.fog, t);
      scene.fog.density = THREE.MathUtils.lerp(
        CONFIG.fog.dayDensity,
        CONFIG.fog.nightDensity,
        t
      );
      ground.material.color.copy(DAY.ground).lerp(NIGHT.ground, t);
      courtyardGroundMat.color.copy(DAY.courtyardGround).lerp(NIGHT.courtyardGround, t);
      courtyardPathMat.color.copy(DAY.courtyardPath).lerp(NIGHT.courtyardPath, t);
      courtyardPathMat.emissiveIntensity = t * 0.6;

      // 新增场景元素同步昼夜：草坪 / 水面 / 河岸 / 草与石头（实例色由材质整体染色）
      meadowMat.color.copy(DAY.meadow).lerp(NIGHT.meadow, t);
      riverWaterMat.color.copy(DAY.river).lerp(NIGHT.river, t);
      // 夜里的自发光只保留一层很暗的冷蓝水色，数值远低于 Bloom 阈值
      riverWaterMat.emissiveIntensity = t * 0.35;
      riverBankMat.color.copy(DAY.riverBank).lerp(NIGHT.riverBank, t);
      grassMat.color.copy(DAY.grassTint).lerp(NIGHT.grassTint, t);
      shrubMat.color.copy(DAY.shrubTint).lerp(NIGHT.shrubTint, t);
      stoneMat.color.copy(DAY.stoneTint).lerp(NIGHT.stoneTint, t);
      bridgeWoodMat.color.copy(DAY.bridgeWood).lerp(NIGHT.bridgeWood, t);
      bridgeDarkMat.color.copy(DAY.bridgeDark).lerp(NIGHT.bridgeDark, t);
      fallingLeaves.material.color.copy(DAY.leafTint).lerp(NIGHT.leafTint, t);

      fenceGlassMat.opacity = THREE.MathUtils.lerp(0.16, 0.17, t);
      fenceGlassMat.emissiveIntensity = t * 0.15;

      ambient.color.copy(DAY.ambientColor).lerp(NIGHT.ambientColor, t);
      ambient.intensity = THREE.MathUtils.lerp(DAY.ambientIntensity, NIGHT.ambientIntensity, t);

      hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, t);
      hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, t);
      hemi.intensity = THREE.MathUtils.lerp(DAY.hemiIntensity, NIGHT.hemiIntensity, t);

      sun.color.copy(DAY.sunColor).lerp(NIGHT.sunColor, t);
      sun.intensity = THREE.MathUtils.lerp(DAY.sunIntensity, NIGHT.sunIntensity, t);
      sun.position.lerpVectors(DAY.sunPosition, NIGHT.sunPosition, t);

      rim.color.copy(DAY.rimColor).lerp(NIGHT.rimColor, t);
      rim.intensity = THREE.MathUtils.lerp(DAY.rimIntensity, NIGHT.rimIntensity, t);

      wallMat.color.copy(DAY.wall).lerp(NIGHT.wall, t);
      roofMat.color.copy(DAY.roof).lerp(NIGHT.roof, t);
      ghostRoofMat.color.copy(DAY.roof).lerp(NIGHT.roof, t);
      trimMat.color.copy(DAY.trim).lerp(NIGHT.trim, t);
      for (const mat of roofSlabMats) {
        mat.color.copy(DAY.roofSlab).lerp(NIGHT.roofSlab, t);
      }

      // 剖切查看时降低玻璃不透明度，让室内家具透出来；透视模式再压淡一层
      const glassClear =
        (cutawayFloor === null ? 1 : 0.1) * (xrayEnabled ? CONFIG.xray.glassOpacity : 1);
      glassMat.opacity = THREE.MathUtils.lerp(DAY.glassOpacity, NIGHT.glassOpacity, t) * glassClear;

      // 室内暖光：白天也保留柔和的暖光（便于看进屋里），夜间更亮；剖切时单独加强
      interiorLights.forEach((light, i) => {
        if (cutawayFloor === null) {
          const base = THREE.MathUtils.lerp(interiorDayIntensity[i], interiorNightIntensity[i], t);
          light.intensity = xrayEnabled ? Math.max(base, CONFIG.xray.interiorLight) : base;
        } else if (cutawayFloor === i) {
          light.intensity = CONFIG.lights.interiorCutaway + t * 2.5;
        } else {
          light.intensity = 0;
        }
      });
      glassMat.emissiveIntensity = THREE.MathUtils.lerp(
        DAY.glassEmissiveIntensity,
        NIGHT.glassEmissiveIntensity,
        t
      );
      for (const lamp of windowLights) {
        lamp.intensity = THREE.MathUtils.lerp(
          DAY.windowLightIntensity,
          NIGHT.windowLightIntensity,
          t
        );
      }

      // 红灯笼：灯身保持饱和红，夜间柔光交给叠加光晕 Sprite
      lanternRedMat.emissiveIntensity = THREE.MathUtils.lerp(0.7, 1.9, t);
      const haloFade = THREE.MathUtils.smoothstep(t, 0.08, 0.7);
      lanternHaloMat.opacity = 0.62 * haloFade;
      lanternHaloMat.visible = haloFade > 0.02;

      // 曝光由 OutputPass 在最后统一做 ACES 色调映射；这里只随昼夜改变曝光
      renderer.toneMappingExposure = THREE.MathUtils.lerp(DAY.exposure, NIGHT.exposure, t);

      // HDR 环境光同步减弱：白天让金属 / 玻璃映出天空，夜晚只留一点冷调反射
      scene.environmentIntensity = THREE.MathUtils.lerp(
