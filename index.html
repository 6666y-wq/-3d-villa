<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新中式三层别墅 · 3D</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #232327;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: fixed;
      left: 24px;
      bottom: 22px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(20, 20, 24, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: rgba(240, 240, 245, 0.82);
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: 0.2px;
      pointer-events: none;
      user-select: none;
      z-index: 5;
    }
    .hud strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 600;
      color: #f4f4f8;
      letter-spacing: 1px;
    }
    .hud span { opacity: 0.7; }

    /* ---------- 3D 空间标签（CSS2DRenderer） ---------- */
    .label-layer {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }
    .room-label {
      position: absolute;
      padding: 4px 10px 4px 8px;
      border-radius: 999px;
      background: rgba(8, 10, 16, 0.5);
      border: 1px solid rgba(130, 190, 255, 0.24);
      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.28),
        0 0 10px rgba(84, 166, 255, 0.12);
      color: rgba(240, 246, 255, 0.94);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.6px;
      white-space: nowrap;
      text-shadow: 0 0 5px rgba(120, 190, 255, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
      user-select: none;
    }
    .room-label::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 4px;
      margin-right: 5px;
      border-radius: 50%;
      background: #9be0ff;
      box-shadow: 0 0 4px rgba(108, 201, 255, 0.7);
      vertical-align: 1px;
    }
    /* 去掉以前向下伸出的尖角，保持小气泡的干净轮廓 */
    .room-label::after { display: none; }

    /* ---------- 楼层分层显示控制面板 ---------- */
    .floor-panel {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 212px;
      padding: 14px 14px 16px;
      border-radius: 16px;
      background: linear-gradient(160deg, rgba(40, 47, 60, 0.72), rgba(14, 16, 22, 0.66));
      border: 1px solid rgba(122, 178, 255, 0.3);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.48),
        0 0 24px rgba(96, 156, 255, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(16px) saturate(150%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      color: rgba(236, 242, 255, 0.9);
      user-select: none;
      z-index: 10;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }
    .floor-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(150, 200, 255, 0.75), transparent);
      border-radius: 1px;
    }
    .floor-panel__title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #eaf2ff;
    }
    .floor-panel__hint {
      margin: 4px 0 12px;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.4px;
      color: rgba(200, 214, 235, 0.55);
    }
    .floor-btn {
      appearance: none;
      display: block;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(140, 180, 255, 0.18);
      background: rgba(255, 255, 255, 0.045);
      color: rgba(226, 234, 250, 0.82);
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        color 0.18s ease,
        transform 0.12s ease;
    }
    .floor-btn + .floor-btn { margin-top: 8px; }
    .floor-btn:hover {
      background: rgba(120, 168, 255, 0.14);
      border-color: rgba(140, 190, 255, 0.42);
      color: #f2f7ff;
      box-shadow: 0 0 14px rgba(96, 156, 255, 0.24);
    }
    .floor-btn:active { transform: translateY(1px); }
    .floor-btn:focus-visible {
      outline: 2px solid rgba(140, 190, 255, 0.6);
      outline-offset: 2px;
    }
    .floor-btn.is-active {
      background: linear-gradient(180deg, rgba(96, 156, 255, 0.34), rgba(56, 110, 210, 0.28));
      border-color: rgba(150, 200, 255, 0.78);
      color: #ffffff;
      box-shadow:
        0 0 16px rgba(96, 156, 255, 0.42),
        inset 0 0 12px rgba(150, 200, 255, 0.18);
    }

    /* ---------- 昼夜切换 ---------- */
    .panel-divider {
      height: 1px;
      margin: 12px 2px 10px;
      background: linear-gradient(90deg, transparent, rgba(150, 200, 255, 0.28), transparent);
    }
    .floor-panel__title + .daynight-btn { margin-top: 8px; }
    .daynight-btn {
      border-color: rgba(255, 196, 120, 0.3);
      background: rgba(255, 190, 110, 0.08);
      color: rgba(255, 234, 202, 0.9);
    }
    .daynight-btn:hover {
      background: rgba(255, 190, 110, 0.17);
      border-color: rgba(255, 205, 135, 0.58);
      color: #fff8ee;
      box-shadow: 0 0 14px rgba(255, 170, 80, 0.26);
    }
    .daynight-btn.is-night {
      background: linear-gradient(180deg, rgba(88, 132, 190, 0.36), rgba(26, 48, 86, 0.5));
      border-color: rgba(130, 180, 255, 0.72);
      color: #eaf3ff;
      box-shadow:
        0 0 16px rgba(90, 150, 255, 0.34),
        inset 0 0 12px rgba(120, 180, 255, 0.16);
    }

    /* ---------- 第一人称漫游 ---------- */
    .roam-btn {
      border-color: rgba(120, 235, 190, 0.28);
      background: rgba(96, 220, 170, 0.08);
      color: rgba(214, 255, 238, 0.9);
    }
    .roam-btn:hover {
      background: rgba(96, 220, 170, 0.17);
      border-color: rgba(130, 245, 200, 0.58);
      color: #f2fffa;
      box-shadow: 0 0 14px rgba(70, 220, 160, 0.26);
    }
    .roam-btn.is-active {
      background: linear-gradient(180deg, rgba(72, 200, 150, 0.36), rgba(20, 96, 76, 0.5));
      border-color: rgba(140, 250, 205, 0.72);
      color: #f0fff9;
      box-shadow:
        0 0 16px rgba(60, 220, 160, 0.38),
        inset 0 0 12px rgba(140, 255, 210, 0.16);
    }

    /* ---------- 外墙透视（结构视图） ---------- */
    .xray-btn {
      border-color: rgba(120, 215, 255, 0.3);
      background: rgba(80, 190, 255, 0.08);
      color: rgba(216, 245, 255, 0.92);
    }
    .xray-btn:hover {
      background: rgba(80, 190, 255, 0.17);
      border-color: rgba(130, 225, 255, 0.6);
      color: #f2fcff;
      box-shadow: 0 0 14px rgba(70, 190, 255, 0.28);
    }
    .xray-btn.is-active {
      background: linear-gradient(180deg, rgba(70, 190, 255, 0.34), rgba(18, 84, 132, 0.5));
      border-color: rgba(150, 232, 255, 0.78);
      color: #f4fdff;
      box-shadow:
        0 0 16px rgba(70, 195, 255, 0.42),
        inset 0 0 12px rgba(150, 232, 255, 0.18);
    }

    /* 漫游准星：只做视觉提示，不拦截鼠标事件 */
    .roam-crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .roam-crosshair.is-visible { opacity: 1; }
    .roam-crosshair::before,
    .roam-crosshair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(226, 255, 246, 0.85);
      box-shadow: 0 0 6px rgba(120, 255, 220, 0.9);
    }
    .roam-crosshair::before {
      width: 1px;
      height: 100%;
      transform: translate(-50%, -50%);
    }
    .roam-crosshair::after {
      width: 100%;
      height: 1px;
      transform: translate(-50%, -50%);
    }

    /* 漫游操作提示 */
    .roam-hint {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(6px);
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(8, 18, 16, 0.62);
      border: 1px solid rgba(130, 245, 200, 0.28);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.35),
        0 0 18px rgba(60, 220, 160, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(226, 255, 244, 0.9);
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0.8px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      z-index: 20;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }
    .roam-hint.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 560px) {
      .floor-panel {
        top: 14px;
        right: 14px;
        width: 168px;
        padding: 11px;
        border-radius: 14px;
      }
      .floor-btn {
        padding: 8px 10px;
        font-size: 12px;
      }
      .floor-panel__hint { margin-bottom: 10px; }
      .roam-hint {
        bottom: 18px;
        padding: 8px 12px;
        font-size: 11px;
        letter-spacing: 0.4px;
      }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <strong>VILLA · 新中式三层别墅</strong>
    左键拖拽旋转 · 滚轮缩放 · 右键平移 · 漫游模式 WASD 移动<br />
    <span>白墙 · 黛瓦双坡顶 · PBR 材质 · 指数雾 · 草叶风场 · 水面涟漪 · 星空 / 萤火虫 · Three.js r169</span>
  </div>

  <div class="roam-crosshair" id="roam-crosshair" aria-hidden="true"></div>
  <div class="roam-hint" id="roam-hint" role="status">
    W A S D 移动 · 鼠标环顾 · Shift 加速 · ESC 退出漫游
  </div>

  <div class="floor-panel" role="group" aria-label="场景显示控制">
    <div class="floor-panel__title">楼层分层显示</div>
    <div class="floor-panel__hint">单独查看一层 · 透视查看室内家具</div>
    <button class="floor-btn is-active" type="button" data-floor="all" aria-pressed="true">显示全部</button>
    <button class="floor-btn" type="button" data-floor="1" aria-pressed="false">只看一楼</button>
    <button class="floor-btn" type="button" data-floor="2" aria-pressed="false">只看二楼</button>
    <button class="floor-btn" type="button" data-floor="3" aria-pressed="false">只看三楼</button>

    <div class="panel-divider"></div>
    <div class="floor-panel__title">结构视图</div>
    <div class="floor-panel__hint">外墙半透明 · 楼板 / 楼梯 / 隔断 / 家具保持实体</div>
    <button class="floor-btn xray-btn" type="button" id="xray-btn"
            aria-pressed="false" aria-label="让外墙半透明，查看室内结构">👁️ 透视墙体</button>

    <div class="panel-divider"></div>
    <div class="floor-panel__title">昼夜光照</div>
    <button class="floor-btn daynight-btn" type="button" id="daynight-btn"
            aria-pressed="false" aria-label="当前为白天，切换到夜晚">🌙 切换到夜晚</button>

    <div class="panel-divider"></div>
    <div class="floor-panel__title">第一人称漫游</div>
    <div class="floor-panel__hint">视点 1.7m · 鼠标环顾 · WASD 移动</div>
    <button class="floor-btn roam-btn" type="button" id="roam-btn"
            aria-pressed="false" aria-label="进入第一人称漫游模式">🚶 漫游模式</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    const canvas = document.getElementById('scene');

    // =====================================================================
    // 全局视觉配置（一键调参入口）
    // ---------------------------------------------------------------------
    // 颜色 / 雾密度 / 曝光 / 灯光强度 / 材质参数 / 粒子特效全部集中在这里。
    // 下方 DAY / NIGHT 两套预设直接读取 CONFIG，昼夜切换只插值颜色与强度，
    // 不会再出现“数值散落在 3000 行代码里”的情况。
    // =====================================================================
    const CONFIG = {
      // ---------- 颜色 ----------
      colors: {
        day: {
          background: 0xdde6f0,
          fog: 0xdde6f0,
          ground: 0x8d97a4,
          courtyardGround: 0x6f8a5f,
          courtyardPath: 0x8a9099,
          meadow: 0x6d8a5c,
          river: 0x2f6f8a,
          riverBank: 0x6b6a52,
          grassTint: 0xffffff,
          shrubTint: 0xffffff,
          stoneTint: 0xffffff,
          bridgeWood: 0x7a5638,
          bridgeDark: 0x4d3524,
          leafTint: 0xffffff,
          wall: 0xf0f0f0,
          roof: 0x2a2f4c,        // 深蓝偏灰的黛瓦
          roofSlab: 0xffffff,    // 坡面靠瓦垄贴图着色，基色保持白
          trim: 0x2a211c,
          ambient: 0xd8e4f5,
          hemiSky: 0xdfe8ff,
          hemiGround: 0x5a5660,
          sun: 0xffffff,
          rim: 0x9fb4ff
        },
        night: {
          background: 0x070f1c,
          fog: 0x0a0f1c,          // 深夜指数雾：深蓝
          ground: 0x121924,
          courtyardGround: 0x2b4236,
          courtyardPath: 0x4b5563,
          meadow: 0x26382e,
          river: 0x0e2534,
          riverBank: 0x2a2c24,
          grassTint: 0x9fb6d2,
          shrubTint: 0x93a9c4,
          stoneTint: 0x9fb0c4,
          bridgeWood: 0x6a8098,
          bridgeDark: 0x37495d,
          leafTint: 0xa9b9cf,
          wall: 0xc9d8ea,
          roof: 0x1e2540,
          roofSlab: 0xffffff,
          trim: 0x141d29,
          ambient: 0x7fa6cf,
          hemiSky: 0x35577e,
          hemiGround: 0x0b1220,
          sun: 0x8fb6ff,
          rim: 0x5b7fb3
        },
        // 材质基础色（与昼夜预设解耦的实体颜色）
        material: {
          wall: 0xf0f0f0,
          roof: 0x2a2f4c,
          trim: 0x2a211c,
          glass: 0x16242e,
          water: 0x2f6f8a,
          waterEmissive: 0x123a52
        }
      },

      // ---------- 雾：指数雾，白天轻薄、夜晚浓郁 ----------
      fog: {
        dayDensity: 0.0075,
        nightDensity: 0.015
      },

      // ---------- 曝光（ACESFilmic） ----------
      exposure: {
        day: 1.2,
        night: 1.12
      },

      // ---------- 灯光强度 ----------
      lights: {
        ambientDay: 0.65,
        ambientNight: 0.45,
        hemiDay: 0.5,
        hemiNight: 0.5,
        sunDay: 1.5,
        sunNight: 0.25,
        rimDay: 0.45,
        rimNight: 0.2,
        windowDay: 0.06,        // 白天窗内一点点暖光，玻璃不至于像一块黑板
        windowNight: 0.36,
        interiorDay: [2.6, 2.2, 1.8],   // 白天室内基础暖光：有窗也要有一点层次
        interiorNight: [1.5, 1.5, 0.9],
        interiorCutaway: 4.0,
        environmentDay: 0.55,
        environmentNight: 0.12
      },

      // ---------- 材质参数 ----------
      materials: {
        wallRoughness: 0.9,          // 墙面微弱粗糙度，告别塑料反光
        roofRoughness: 0.58,
        roofMetalness: 0.3,          // 瓦面微弱高光
        roofEnvMapIntensity: 0.75,
        glassOpacity: 0.6,
        glassNightOpacity: 0.6,
        glassRoughness: 0.1,
        glassMetalness: 0.8,
        glassEnvMapIntensity: 0.5,
        glassEmissiveDay: 0,
        glassEmissiveNight: 1.4,
        waterRoughness: 0.68,
        waterMetalness: 0.0,
        waterOpacity: 0.94,
        waterEnvMapIntensity: 0.35,
        waterBumpScale: 0.2
      },

      // ---------- 草地风场（顶点着色器） ----------
      grass: {
        windStrength: 0.22,
        windSpeed: 1.15
      },

      // ---------- 水面动态（UV 漂移 + bump / 透明度呼吸） ----------
      water: {
        uvDriftSpeed: 0.02,
        uvSwaySpeed: 0.55,
        uvSwayAmount: 0.012,
        bumpBreathSpeed: 0.9,
        bumpBreathAmp: 0.03,
        opacityBreathSpeed: 0.7,
        opacityBreathAmp: 0.025
      },

      // ---------- 星空 ----------
      stars: {
        size: 1.7,                   // 比旧版 3.2 更细碎
        brightnessMin: 0.45,
        brightnessMax: 1.0,
        twinkleSpeedMin: 0.6,
        twinkleSpeedMax: 2.2,
        twinkleDepth: 0.4,
        // 微蓝 / 微黄 / 冷白 / 暖白四种星色
        palette: [
          [0.62, 0.78, 1.0],
          [1.0, 0.9, 0.68],
          [0.78, 0.88, 1.0],
          [1.0, 0.98, 0.86]
        ]
      },

      // ---------- 萤火虫 ----------
      fireflies: {
        flickerMin: 1.2,
        flickerMax: 2.8,
        lightCount: 2,               // 只挂 2 盏微光，避免 PointLight 拖垮帧率
        lightIntensity: 1.8,
        lightDistance: 3.4,
        lightColor: 0xffd27a
      },

      // ---------- 水面涟漪 ----------
      ripples: {
        count: 9,
        speedMin: 0.12,
        speedMax: 0.24,
        sizeMin: 2.2,
        sizeMax: 3.8,
        opacity: 0.17,
        nightBoost: 0.35            // 夜里涟漪更明显一点
      },

      // ---------- 结构透视（只让外墙变半透明） ----------
      xray: {
        wallOpacity: 0.18,      // 外墙透明度：既能看清室内，又保留墙体轮廓
        glassOpacity: 0.12,     // 透视时玻璃进一步变淡，避免深色玻璃挡住视线
        interiorLight: 3.2      // 透视时室内暖光下限
      },

      // ---------- 阴影 ----------
      shadows: {
        mapSize: 2048,
        radius: 4
      },

      // ---------- 实例数量（性能调优） ----------
      counts: {
        grass: 4800,           // 掉帧时优先调小：4800 → 3600 → 2400
        grassClumpSize: 10,
        fallingLeaves: 50,
        shrubs: 60,
        stones: 80,
        forestTrees: 200,
        forestRange: 40,
        stars: 1100,
        fireflies: 60
      },

      // ---------- 生活化细节（红灯笼 / 石桌 / 竹林 / 乌篷船 / 芦苇 / 孔明灯） ----------
      // 这些物件只做氛围，不参与阴影投射；颜色集中放在这里，方便统一调整中式色调。
      life: {
        lanternRed: 0xff1408,
        lanternGold: 0xc9a24a,
        lanternTassel: 0x8e1b12,
        stone: 0x707779,
        stoneDark: 0x565d60,
        bambooCulm: 0x5f8f43,
        bambooNode: 0x446b30,
        bambooLeaf: 0x6fa84f,
        reedStem: 0x9aa66a,
        reedHead: 0xa97b4b,
        boatHull: 0x40342a,

    // ================= 场景密度 / 布局参数（性能调优入口） =================

    // ---------- 渲染器 ----------
    const renderer = new THREE.WebGLRenderer({

    const RENDER_PIXEL_RATIO = Math.min(window.devicePixelRatio || 1, 1.5);

    // 性能调试：关闭 info 自动重置，改由渲染循环手动 reset，
    // 这样 __villaDebug 读到的是整帧（含泛光 / 阴影 pass）真实 draw call 总数，而不是最后一个全屏 pass。
    renderer.info.autoReset = false;

    // ---------- CSS2D 标签渲染器（3D 空间中的 HTML 标签） ----------

    // ---------- 场景（指数雾：白天轻薄，夜晚浓成深蓝夜色） ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(CONFIG.colors.day.background);
    // 统一使用 FogExp2：昼夜只插值颜色与密度，避免切换雾类型时出现跳变。
    // 夜晚密度 0.015 会让远处的树、河面与森林迅速隐入深蓝，纵深感更强。
    scene.fog = new THREE.FogExp2(CONFIG.colors.day.fog, CONFIG.fog.dayDensity);

    // ---------- 环境贴图（IBL）：让 PBR 材质拥有真实反射 ----------
    // PMREM 会把等距柱状 HDR 预滤波成 mip 链，金属 / 玻璃 / 石材的反射才不会糊成一片。
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    // jsDelivr 直连 three.js 官方示例 HDR（1k），首次打开需要联网
    const ENV_HDR_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r169/examples/textures/equirectangular/royal_esplanade_1k.hdr';

    // 断网 / CDN 失败时的兜底：程序化天空 + 地面渐变，仍然给材质柔和的环境光
    function createProceduralEnvironmentTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024;
      cv.height = 512;
      const ctx = cv.getContext('2d');

      const sky = ctx.createLinearGradient(0, 0, 0, cv.height);
      sky.addColorStop(0.0, '#7fa8d8');
      sky.addColorStop(0.42, '#cddff2');
      sky.addColorStop(0.5, '#eef2f2');
      sky.addColorStop(0.52, '#6d7a68');
      sky.addColorStop(1.0, '#2f382e');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, cv.width, cv.height);

      const sun = ctx.createRadialGradient(
        cv.width * 0.7, cv.height * 0.28, 0,
        cv.width * 0.7, cv.height * 0.28, 170
      );
      sun.addColorStop(0, 'rgba(255, 250, 235, 1)');
      sun.addColorStop(0.22, 'rgba(255, 244, 214, 0.8)');
      sun.addColorStop(1, 'rgba(255, 240, 210, 0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, cv.width, cv.height);

      const tex = new THREE.CanvasTexture(cv);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function applyEnvironmentMap(sourceTexture) {
      sourceTexture.mapping = THREE.EquirectangularReflectionMapping;
      const envTarget = pmremGenerator.fromEquirectangular(sourceTexture);
      scene.environment = envTarget.texture; // 只参与环境光 / 反射，不覆盖背景与雾
      scene.environmentIntensity = CONFIG.lights.environmentDay;
      sourceTexture.dispose(); // PMREM 纹理已独立，源贴图可以释放
    }

      ENV_HDR_URL,

      undefined,
      (error) => {

    // 只让暖窗、萤火虫与星点溢出柔光；白天 strength 为 0，避免白墙被糊掉。
    const BLOOM_STRENGTH = 0.32; // 夜间目标强度（0.25~0.35，克制）
    const BLOOM_RADIUS = 0.36;   // 柔而不散
    // 只让亮度接近纯白的窗户 / 萤火虫溢出柔光；水面、玻璃、瓦面的高光都被挡在阈值以下
    const BLOOM_THRESHOLD = 0.78;
    const composer = new EffectComposer(renderer);
    composer.renderTarget1.samples = 2; // 低倍 MSAA，保留屋檐 / 窗框边缘
    composer.renderTarget2.samples = 2;
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      BLOOM_STRENGTH,
      BLOOM_RADIUS,
      BLOOM_THRESHOLD
    );
    bloomPass.strength = 0; // 白天关闭
    composer.addPass(bloomPass);

    // OutputPass 负责整条链路的最终 ACES 色调映射 + sRGB 输出，
    // 必须放在 composer 的最后一位，否则泛光 / 中间缓冲会再次被错误编码，画面发灰。
    composer.addPass(new OutputPass());

    // ---------- 轨道控制器 ----------

    // 黛瓦瓦垄贴图：沿坡面方向的明暗条纹，模拟一片片瓦
    function createTileTexture() {

      const tex = new THREE.CanvasTexture(cv);

    // ---------- 构件工具：RoundedBoxGeometry 圆角几何体 ----------
    // 半径 0.05m、分段 2：建筑边缘获得柔和的倒角高光，不再有廉价的直角。
    // 细小构件（窗棂 / 压条）会被 RoundedBoxGeometry 自动夹到最小边长的一半，
    // 不会因为圆角过大而破面；相同尺寸的几何体走缓存，避免重复分配显存。
    const ROUNDED_RADIUS = 0.05;
    const ROUNDED_SEGMENTS = 2;
    const roundedBoxGeoCache = new Map();

    function getRoundedBoxGeometry(w, h, d, radius = ROUNDED_RADIUS) {
      const r = Math.max(0.0001, Math.min(radius, w / 2, h / 2, d / 2));
      const key = w.toFixed(3) + ':' + h.toFixed(3) + ':' + d.toFixed(3) + ':' + r.toFixed(4);
      let geo = roundedBoxGeoCache.get(key);
      if (!geo) {
        geo = new RoundedBoxGeometry(w, h, d, ROUNDED_SEGMENTS, r);
        roundedBoxGeoCache.set(key, geo);
      }
      return geo;
    }

        getRoundedBoxGeometry(size[0], size[1], size[2], radius),

      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;

    // 三楼书房/露台：长条书桌 + 极简座椅 + 桌上书本

    // 三楼衣帽间：开放柜体 + 挂衣杆 + 叠放衣物

    const roomBuilders = [addLivingRoom, addBedroom, addStudy];
    const roomLabelDefs = [
      { text: '客厅', y: 2.15, z: 0.6 },
      { text: '卧室', y: 1.75, z: -0.1 },
      { text: '书房/露台', y: 1.6, z: 0.2 }
    ];
    // 次房间的小标签（和主标签一起参与分层显隐）
    const extraLabelDefs = [
      [
        { text: '卫生间', x: -2.8, y: 1.55, z: -1.7 },
        { text: '楼梯', x: 1.98, y: 1.75, z: 0.5 }
      ],
      [{ text: '卫生间', x: -1.9, y: 1.5, z: 1.95 }],
      [{ text: '衣帽间', x: -1.12, y: 1.4, z: 1.1 }]
    ];

    // 双坡屋顶：屋脊沿 X 轴，两片坡面朝向 ±Z
    // hole 给上层体块让出洞口：{ w, d }，否则上层墙体会直接穿过坡屋面
    const roofSlabMatCache = new Map();
    function getRoofSlabMaterial(pieceW) {
      const repeats = Math.max(2, Math.round(pieceW / 0.55));
      let mat = roofSlabMatCache.get(repeats);
      if (!mat) {
        mat = roofMat.clone();
        mat.color.set(0xffffff); // 贴图已带黛青色，基色设为白避免相乘变黑
        mat.map = tileTexture.clone();
        mat.map.repeat.set(repeats, 1);
        mat.map.needsUpdate = true;
        roofSlabMats.push(mat);
        roofSlabMatCache.set(repeats, mat);
      }
      return mat;
    }

    function addGableRoof(parent, width, depth, eaveY, rise, overhang, hole = null) {
      const roofW = width + overhang * 2;
      const roofD = depth + overhang * 2;
      const halfD = roofD / 2;
      const angle = Math.atan2(rise, halfD);
      const slopeLen = Math.hypot(halfD, rise);
      const thickness = 0.16;
      const lift = thickness / 2 / Math.cos(angle);
      const tan = Math.tan(angle);

      const holeW = hole ? Math.min(hole.w + 0.04, roofW - 0.2) : 0;
      const holeD = hole ? Math.min(hole.d + 0.04, roofD - 0.2) : 0;
      const holeHalfW = holeW / 2;
      const holeHalfD = holeD / 2;

      // 屋顶所有构件都打上标记：切到某一层时统一换成半透明材质，
      // 否则山墙封板 / 屋脊 / 檐口仍然实体，会从上方挡住室内
      const markRoofPart = (mesh) => {
        mesh.userData.isRoofPanel = true;
        mesh.userData.roofMaterial = mesh.material;
        return mesh;
      };

      // 按平面矩形拼出一块坡面板：内部会自动算出这段坡长与中心高度
      function addRoofPiece(xMin, xMax, zA, zB) {
        const pieceW = xMax - xMin;
        const pieceD = Math.abs(zB - zA);
        if (pieceW < 0.02 || pieceD < 0.02) return;
        const centerZ = (zA + zB) / 2;
        const len = pieceD / Math.cos(angle);
        const slab = addBox(
          parent,
          [pieceW, thickness, len],
          [(xMin + xMax) / 2, eaveY + (halfD - Math.abs(centerZ)) * tan + lift, centerZ],
          getRoofSlabMaterial(pieceW)
        );
        slab.rotation.x = Math.sign(centerZ) * angle;
        markRoofPart(slab);
      }

      for (const dir of [1, -1]) {
        if (holeW > 0 && holeD > 0) {
          const zEave = dir * halfD;
          const zHole = dir * holeHalfD;
          // 洞口两侧的通长坡面
          addRoofPiece(-roofW / 2, -holeHalfW, 0, zEave);
          addRoofPiece(holeHalfW, roofW / 2, 0, zEave);
          // 洞口到檐口之间的一段
          addRoofPiece(-holeHalfW, holeHalfW, zHole, zEave);
        } else {
          addRoofPiece(-roofW / 2, roofW / 2, 0, dir * halfD);
        }
      }

      // 两端三角形山墙封板
      const shape = new THREE.Shape();
      shape.moveTo(-halfD, 0);
      shape.lineTo(halfD, 0);
      shape.lineTo(0, rise);
      shape.closePath();
      const capGeo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.12,
        bevelEnabled: false
      });
      capGeo.rotateY(Math.PI / 2);

      for (const dir of [1, -1]) {
        const cap = new THREE.Mesh(capGeo, roofMat);
        cap.position.set(dir === 1 ? roofW / 2 - 0.12 : -roofW / 2, eaveY, 0);
        cap.castShadow = true;
        cap.receiveShadow = true;
        parent.add(cap);
        markRoofPart(cap);
      }

      // 屋脊压顶：有洞口时断开，让上层体块从中间升起
      if (holeW > 0.01 && holeD > 0.01) {
        const seg = (roofW - holeW) / 2;
        for (const sx of [-1, 1]) {
          markRoofPart(addBox(
            parent,
            [seg, 0.2, 0.34],
            [sx * (holeHalfW + seg / 2), eaveY + rise + 0.06, 0],
            roofMat
          ));
        }
      } else {
        markRoofPart(addBox(parent, [roofW, 0.2, 0.34], [0, eaveY + rise + 0.06, 0], roofMat));
      }

      // 檐口木线（屋檐下方的深色收边）
      for (const dir of [1, -1]) {
        markRoofPart(addBox(
          parent,
          [roofW, 0.14, 0.18],
          [0, eaveY - 0.07, dir * (halfD - 0.06)],
          trimMat
        ));
      }

      // 博风板：沿两坡斜边的深色收边，略外挑避免与山墙共面
      for (const sx of [1, -1]) {
        for (const dir of [1, -1]) {
          const barge = markRoofPart(addBox(
            parent,
            [0.14, 0.2, slopeLen],
            [sx * (roofW / 2 - 0.04), eaveY + rise / 2 + 0.06, (dir * halfD) / 2],
            trimMat
          ));
          barge.rotation.x = dir * angle;
        }
      }
    }

    // ---------- 三层体块 + 黛瓦屋顶 + 线脚 + 落地窗 ----------
    const tiers = [
      {
        w: 7.2, d: 7.2, h: 2.8, rise: 1.3, overhang: 0.7,
        windows: [{ x: -1.85, w: 2.2 }, { x: 1.85, w: 2.2 }]
      },
      {
        w: 5.4, d: 5.4, h: 2.55, rise: 1.15, overhang: 0.65,
        windows: [{ x: -1.3, w: 1.8 }, { x: 1.3, w: 1.8 }]
      },
      {
        w: 3.6, d: 3.6, h: 2.3, rise: 1.45, overhang: 0.65,
        windows: [{ x: 0, w: 2.0 }]
      }
    ];

    const floorGroups = []; // 每层一个 Group，供分层显示切换
    const floorWallMeshes = []; // 所有外墙板，用于单层查看的剖切阴影控制
    const outerWallMeshes = []; // 仅外墙板：透视模式只改这些
    const wallPanelsByFloor = [[], [], []];
    const interiorWallMeshes = []; // 室内隔断（透视时保持实体）
    const stairStepMeshes = []; // 踏步
    const stairRailMeshes = []; // 楼梯扶手 / 栏杆
    const ceilingSlabs = []; // 每层楼板（剖切时隐藏当前层顶板）
    const floorLabels = []; // 每层的 CSS2D 空间标签
    const extraFloorLabels = [[], [], []]; // 次房间标签
    const interiorLights = []; // 单层查看时点亮室内
    const interiorNightIntensity = CONFIG.lights.interiorNight; // 夜间一楼 / 二楼常亮，三楼略弱
    const interiorDayIntensity = CONFIG.lights.interiorDay;

    // ---------- 结构参数 ----------
    const WALL_T = 0.16; // 外墙厚度
    const CEIL_T = 0.12; // 楼板厚度
    // 一楼到二楼的直跑楼梯：贴东墙，底部在南侧，顶部朝北
    const STAIR = {
      xMin: 1.5,
      xMax: 2.45,
      zBottom: 2.6,
      zTop: -1.7,
      baseY: BASE_Y + 0.06,             // 0.34
      topY: BASE_Y + tiers[0].h + 0.06, // 3.14
      steps: 14,
      // 楼板 / 顶板上的楼梯洞口（比楼梯略宽，留出扶手空间）
      hole: { minX: 1.32, maxX: 2.52, minZ: -1.7, maxZ: 1.55 }
    };

    // 外墙板：统一打标签，透视 / 剖切只处理这些网格
    function addOuterWall(parent, size, position, floorIndex) {
      const mesh = addBox(parent, size, position, wallMat, 0.03);
      mesh.userData.isOuterWall = true;
      mesh.userData.floorIndex = floorIndex;
      outerWallMeshes.push(mesh);
      wallPanelsByFloor[floorIndex].push(mesh);
      floorWallMeshes.push(mesh);
      return mesh;
    }

    // 室内隔断：和家具一样保持实体，不参与透视
    function addInteriorWall(parent, size, position) {
      const mesh = addBox(parent, size, position, interiorWallMat, 0.02);
      mesh.userData.isInteriorWall = true;
      interiorWallMeshes.push(mesh);
      return mesh;
    }

    // 楼板 / 地面板：可选矩形洞口，自动拆成四块，避免板面盖住楼梯
    function addFloorSlab(parent, width, depth, topY, hole, thickness, material, floorIndex) {
      const y = topY - thickness / 2;
      const pieces = [];
      const addPiece = (xMin, xMax, zMin, zMax) => {
        if (xMax - xMin < 0.02 || zMax - zMin < 0.02) return;
        const mesh = addBox(
          parent,
          [xMax - xMin, thickness, zMax - zMin],
          [(xMin + xMax) / 2, y, (zMin + zMax) / 2],
          material,
          0.02
        );
        mesh.userData.floorIndex = floorIndex;
        if (material === ceilingMat) {
          mesh.userData.isCeilingSlab = true;
          ceilingSlabs.push(mesh);
        }
        pieces.push(mesh);
      };

      const halfW = width / 2;
      const halfD = depth / 2;
      if (!hole) {
        addPiece(-halfW, halfW, -halfD, halfD);
      } else {
        addPiece(-halfW, hole.minX, -halfD, halfD);
        addPiece(hole.maxX, halfW, -halfD, halfD);
        addPiece(hole.minX, hole.maxX, -halfD, hole.minZ);
        addPiece(hole.minX, hole.maxX, hole.maxZ, halfD);
      }
      return pieces;
    }

    // 一楼直跑楼梯：踏步 + 木扶手 + 立柱
    function buildStairs(parent) {
      const width = STAIR.xMax - STAIR.xMin;
      const xCenter = (STAIR.xMin + STAIR.xMax) / 2;
      const rise = (STAIR.topY - STAIR.baseY) / STAIR.steps;
      const run = (STAIR.zBottom - STAIR.zTop) / STAIR.steps;

      for (let i = 0; i < STAIR.steps; i++) {
        const hgt = (i + 1) * rise;
        const z = STAIR.zBottom - (i + 0.5) * run;
        const step = addBox(
          parent,
          [width, hgt, run],
          [xCenter, STAIR.baseY + hgt / 2, z],
          stairMat,
          0.015
        );
        step.userData.isStairStep = true;
        stairStepMeshes.push(step);
      }

      // 扶手中心线：从底端到顶端，沿坡度抬起 0.93m
      const railX = STAIR.xMin + 0.04;
      const railLen = Math.hypot(STAIR.zBottom - STAIR.zTop, STAIR.topY - STAIR.baseY);
      const rail = addBox(
        parent,
        [0.05, 0.05, railLen],
        [railX, (STAIR.baseY + STAIR.topY) / 2 + 0.93, (STAIR.zBottom + STAIR.zTop) / 2],
        stairRailMat,
        0.02
      );
      rail.rotation.x = Math.atan2(STAIR.topY - STAIR.baseY, STAIR.zBottom - STAIR.zTop);
      rail.castShadow = true;
      stairRailMeshes.push(rail);

      // 立柱：每两级一根，落在踏步上
      for (let i = 0; i < STAIR.steps; i += 2) {
        const stepTop = STAIR.baseY + (i + 1) * rise;
        const z = STAIR.zBottom - (i + 0.5) * run;
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.025, 0.025, 0.92, 8),
          stairRailMat
        );
        post.position.set(railX, stepTop + 0.46, z);
        post.castShadow = true;
        post.receiveShadow = true;
        parent.add(post);
        stairRailMeshes.push(post);
      }

      // 起步柱
      const newel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.05, 1.02, 10),
        stairRailMat
      );
      newel.position.set(railX, STAIR.baseY + 0.51, STAIR.zBottom + 0.06);
      newel.castShadow = true;
      newel.receiveShadow = true;
      parent.add(newel);
      stairRailMeshes.push(newel);
    }

    // 二楼楼梯洞口栏杆：西侧 + 南侧，防止从洞口直接掉下去
    function buildStairwellRailing(parent, floorTopY) {
      const { minX, maxX, minZ, maxZ } = STAIR.hole;
      const railY = floorTopY + 0.93;
      const midY = floorTopY + 0.465;

      const addBar = (size, position) => {
        const bar = addBox(parent, size, position, stairRailMat, 0.02);
        bar.castShadow = true;
        stairRailMeshes.push(bar);
      };
      const addPost = (x, z) => {
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.028, 0.028, 0.93, 8),
          stairRailMat
        );
        post.position.set(x, midY, z);
        post.castShadow = true;
        post.receiveShadow = true;
        parent.add(post);
        stairRailMeshes.push(post);
      };

      // 西侧通长栏杆
      addBar([0.05, 0.05, maxZ - minZ], [minX, railY, (minZ + maxZ) / 2]);
      for (const z of [minZ + 0.04, (minZ + maxZ) / 2, maxZ - 0.04]) {
        addPost(minX, z);
      }
      // 南侧栏杆
      addBar([maxX - minX, 0.05, 0.05], [(minX + maxX) / 2, railY, maxZ]);
      for (const x of [minX + 0.04, (minX + maxX) / 2, maxX - 0.04]) {
        addPost(x, maxZ);
      }
    }

    let levelY = BASE_Y;

    tiers.forEach((tier, index) => {
      const { w, d, h } = tier;

      // 每层（墙体 + 屋顶 + 窗户 + 线脚）独立成组，便于分层显示
      const tierGroup = new THREE.Group();
      tierGroup.name = 'group_floor' + (index + 1);
      villa.add(tierGroup);
      floorGroups.push(tierGroup);

      // 底层台基 + 入口台阶（归属一楼，切到其它楼层时一起隐藏）
      if (index === 0) {
        addBox(tierGroup, [w + 0.7, BASE_Y, d + 0.7], [0, BASE_Y / 2, 0], trimMat);
        addBox(tierGroup, [2.4, 0.14, 0.7], [0, 0.07, 4.25], stoneStepMat, 0.02);
      }

      // 中空外墙：后墙 + 两侧墙 + 带门窗洞口的正面墙
      const t = WALL_T;
      const innerW = w - t * 2;
      const innerD = d - t * 2;
      const panelY = levelY + h / 2;
      const zFront = d / 2 - t / 2;
      const zBack = -d / 2 + t / 2;
      const xLeft = -w / 2 + t / 2;
      const xRight = w / 2 - t / 2;

      addOuterWall(tierGroup, [w, h, t], [0, panelY, zBack], index);
      addOuterWall(tierGroup, [t, h, innerD], [xLeft, panelY, 0], index);
      addOuterWall(tierGroup, [t, h, innerD], [xRight, panelY, 0], index);

      const winBottom = levelY + (index === 0 ? 0.34 : 0.6);
      const winTop = levelY + h - 0.45;
      const winH = winTop - winBottom;
      const winY = (winTop + winBottom) / 2;
      const doorW = 1.2;
      const doorH = 2.15;
      const doorTop = levelY + doorH;

      const addFrontPanel = (xMin, xMax, yMin, yMax) => {
        if (xMax - xMin < 0.02 || yMax - yMin < 0.02) return;
        addOuterWall(
          tierGroup,
          [xMax - xMin, yMax - yMin, t],
          [(xMin + xMax) / 2, (yMin + yMax) / 2, zFront],
          index
        );
      };

      if (index === 0) {
        // 窗间墙 + 中央门垛
        addFrontPanel(-w / 2, -2.95, winBottom, winTop);
        addFrontPanel(2.95, w / 2, winBottom, winTop);
        addFrontPanel(-0.75, -doorW / 2, winBottom, winTop);
        addFrontPanel(doorW / 2, 0.75, winBottom, winTop);
        // 窗下墙（门洞处断开）
        addFrontPanel(-w / 2, -doorW / 2, levelY, winBottom);
        addFrontPanel(doorW / 2, w / 2, levelY, winBottom);
        // 门头
        addFrontPanel(-doorW / 2, doorW / 2, doorTop, winTop);
        // 窗上墙
        addFrontPanel(-w / 2, w / 2, winTop, levelY + h);
      } else {
        let cursor = -w / 2;
        const ranges = tier.windows
          .map((win) => [win.x - win.w / 2, win.x + win.w / 2])
          .sort((a, b) => a[0] - b[0]);
        for (const [start, end] of ranges) {
          addFrontPanel(cursor, start, winBottom, winTop);
          cursor = end;
        }
        addFrontPanel(cursor, w / 2, winBottom, winTop);
        addFrontPanel(-w / 2, w / 2, levelY, winBottom);
        addFrontPanel(-w / 2, w / 2, winTop, levelY + h);
      }

      // 楼板 + 室内地面（一楼顶板 / 二楼地面给楼梯留洞）
      addFloorSlab(
        tierGroup,
        w,
        d,
        levelY + h,
        index === 0 ? STAIR.hole : null,
        CEIL_T,
        ceilingMat,
        index
      );
      addFloorSlab(
        tierGroup,
        innerW,
        innerD,
        levelY + 0.06,
        index === 1 ? STAIR.hole : null,
        0.06,
        interiorFloorMat,
        index
      );

      // 四角深色立柱
      const post = 0.18;
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          addBox(
            tierGroup,
            [post, h, post],
            [
              sx * (w / 2 - post / 2 + 0.02),
              levelY + h / 2,
              sz * (d / 2 - post / 2 + 0.02)
            ],
            trimMat
          );
        }
      }

      // 每层顶部一圈深色腰线（屋檐下方的装饰线条）
      const bandH = 0.2;
      const bandY = levelY + h - bandH / 2;
      addBox(tierGroup, [w + 0.16, bandH, 0.12], [0, bandY, d / 2 + 0.04], trimMat);
      addBox(tierGroup, [w + 0.16, bandH, 0.12], [0, bandY, -d / 2 - 0.04], trimMat);
      addBox(tierGroup, [0.12, bandH, d + 0.16], [w / 2 + 0.04, bandY, 0], trimMat);
      addBox(tierGroup, [0.12, bandH, d + 0.16], [-w / 2 - 0.04, bandY, 0], trimMat);

      // 底层再加一圈踢脚线
      if (index === 0) {
        const kbH = 0.18;
        const kbY = levelY + kbH / 2;
        addBox(tierGroup, [w + 0.14, kbH, 0.1], [0, kbY, d / 2 + 0.03], trimMat);
        addBox(tierGroup, [w + 0.14, kbH, 0.1], [0, kbY, -d / 2 - 0.03], trimMat);
        addBox(tierGroup, [0.1, kbH, d + 0.14], [w / 2 + 0.03, kbY, 0], trimMat);
        addBox(tierGroup, [0.1, kbH, d + 0.14], [-w / 2 - 0.03, kbY, 0], trimMat);
      }

      // 正面落地窗：深色半透明玻璃 + 深色窗框
      for (const win of tier.windows) {
        const faceZ = d / 2;
        const bar = 0.12;

        // 玻璃：半透明，可透出后面的白墙
        const glass = new THREE.Mesh(
          new THREE.PlaneGeometry(win.w, winH),
          glassMat
        );
        glass.position.set(win.x, winY, faceZ + 0.02);
        tierGroup.add(glass);

        // 夜间从室内透出的暖光：白天强度为 0，只在夜晚逐渐亮起
        const lamp = new THREE.PointLight(0xffb469, 0, 3.5, 2);
        lamp.position.set(win.x, winY, faceZ + 0.35);
        tierGroup.add(lamp);
        windowLights.push(lamp);

        // 窗框：四根深色边框条
        const frameZ = faceZ + 0.05;
        const frameBars = [
          [win.w + bar * 2, bar, 0.06, win.x, winY + winH / 2 + bar / 2],
          [win.w + bar * 2, bar, 0.06, win.x, winY - winH / 2 - bar / 2],
          [bar, winH, 0.06, win.x - win.w / 2 - bar / 2, winY],
          [bar, winH, 0.06, win.x + win.w / 2 + bar / 2, winY]
        ];
        for (const [bw, bh, bd, bx, by] of frameBars) {
          const frameBar = addBox(tierGroup, [bw, bh, bd], [bx, by, frameZ], trimMat);
          frameBar.castShadow = false;
        }

        // 竖向窗棂 + 上亮子横档（略凸于窗框，避免共面闪烁）
        for (const offset of [-win.w / 4, win.w / 4]) {
          const mullion = addBox(
            tierGroup,
            [0.06, winH, 0.05],
            [win.x + offset, winY, faceZ + 0.065],
            trimMat
          );
          mullion.castShadow = false;
        }

        const transom = addBox(
          tierGroup,
          [win.w, 0.05, 0.05],
          [win.x, winY + winH * 0.22, faceZ + 0.065],
          trimMat
        );
        transom.castShadow = false;
      }

      // 入户门：门套 + 半开门扇（首层）
      if (index === 0) {
        const frameZ = d / 2 + 0.03;
        const jamb = 0.09;
        addBox(tierGroup, [jamb, doorH, 0.12], [-doorW / 2 - jamb / 2, levelY + doorH / 2, frameZ], trimMat);
        addBox(tierGroup, [jamb, doorH, 0.12], [doorW / 2 + jamb / 2, levelY + doorH / 2, frameZ], trimMat);
        addBox(tierGroup, [doorW + jamb * 2, jamb, 0.12], [0, levelY + doorH + jamb / 2, frameZ], trimMat);
        addBox(tierGroup, [doorW + 0.12, 0.05, 0.2], [0, levelY + 0.025, d / 2], trimMat);

        const pivot = new THREE.Group();
        pivot.position.set(-doorW / 2 + 0.03, levelY + doorH / 2, d / 2 + 0.06);
        const leafW = doorW - 0.08;
        const leaf = addBox(pivot, [leafW, doorH - 0.08, 0.05], [leafW / 2, 0, 0], doorMat, 0.02);
        leaf.castShadow = true;
        addBox(pivot, [0.05, 0.05, 0.12], [leafW - 0.12, 0, 0.08], trimMat, 0.02);
        pivot.rotation.y = -Math.PI * 0.55;
        tierGroup.add(pivot);
      }

      // 该层双坡屋顶（黛瓦）；下层屋顶给上层体块留洞
      const nextTier = tiers[index + 1];
      addGableRoof(
        tierGroup,
        w,
        d,
        levelY + h,
        tier.rise,
        tier.overhang,
        nextTier ? { w: nextTier.w, d: nextTier.d } : null
      );

      // 室内极简家具：客厅 / 卧室 / 书房 + 次房间
      const furnitureGroup = new THREE.Group();
      furnitureGroup.name = 'furniture_floor' + (index + 1);
      tierGroup.add(furnitureGroup);
      roomBuilders[index](furnitureGroup, levelY);
      if (index === 0) {
        addBathroom1(furnitureGroup, levelY);
      } else if (index === 1) {
        addBathroom2(furnitureGroup, levelY);
      } else {
        addCloset3(furnitureGroup, levelY);
      }

      // 楼梯与二楼洞口栏杆
      if (index === 0) {
        buildStairs(tierGroup);
      }
      if (index === 1) {
        buildStairwellRailing(tierGroup, levelY + 0.06);
      }

      // 室内隔断：一楼卫生间 / 二楼卫生间 / 三楼衣帽间
      const floorTop = levelY + 0.06;
      if (index === 0) {
        const partH = 2.35;
        const partY = floorTop + partH / 2;
        addInteriorWall(tierGroup, [0.1, partH, 1.34], [-2.15, partY, -2.77]);
        addInteriorWall(tierGroup, [0.1, partH, 1.05], [-2.15, partY, -0.725]);
        addInteriorWall(tierGroup, [0.1, 0.3, 0.85], [-2.15, floorTop + partH - 0.15, -1.675]);
        addInteriorWall(tierGroup, [1.29, partH, 0.1], [-2.795, partY, -0.2]);
      } else if (index === 1) {
        const partH = 2.2;
        const partY = floorTop + partH / 2;
        addInteriorWall(tierGroup, [0.1, partH, 1.39], [-1.25, partY, 1.845]);
        addInteriorWall(tierGroup, [0.39, partH, 0.1], [-2.345, partY, 1.15]);
        addInteriorWall(tierGroup, [0.85, 0.3, 0.1], [-1.725, floorTop + partH - 0.15, 1.15]);
      } else {
        const partH = 2.0;
        const partY = floorTop + partH / 2;
        addInteriorWall(tierGroup, [0.1, partH, 1.04], [-0.6, partY, 1.12]);
        addInteriorWall(tierGroup, [0.19, partH, 0.1], [-1.545, partY, 0.6]);
        addInteriorWall(tierGroup, [0.8, 0.3, 0.1], [-1.05, floorTop + partH - 0.15, 0.6]);
      }

      // 悬浮在房间上方的 3D 空间标签
      const labelDef = roomLabelDefs[index];
      const roomLabel = createRoomLabel(
        labelDef.text,
        [0, levelY + labelDef.y, labelDef.z]
      );
      roomLabel.name = 'label_floor' + (index + 1);
      tierGroup.add(roomLabel);
      floorLabels.push(roomLabel);

      extraFloorLabels[index] = extraLabelDefs[index].map((def) => {
        const label = createRoomLabel(def.text, [def.x, levelY + def.y, def.z]);
        tierGroup.add(label);
        return label;
      });

      // 室内暖光：夜间常亮；单独查看该层时再加强
      // 灯泡贴着顶板安装（加一小段吊杆 + 灯罩），不会悬在视线高度挡住家具
      const lightY = levelY + h - 0.28;
      const interiorLight = new THREE.PointLight(0xffd8a8, 0, 6.5, 2);
      interiorLight.position.set(0, lightY, -0.2);
      tierGroup.add(interiorLight);
      interiorLights.push(interiorLight);

      addBox(tierGroup, [0.03, 0.16, 0.03], [0, levelY + h - 0.12, -0.2], trimMat, 0.012);
      const shade = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.24, 0.1, 16),
        trimMat
      );
      shade.position.set(0, lightY + 0.13, -0.2);
      shade.castShadow = true;
      tierGroup.add(shade);

      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 8), lampGlowMat);
      bulb.position.copy(interiorLight.position);
      bulb.castShadow = false;
      bulb.receiveShadow = false;
      tierGroup.add(bulb);

      levelY += h;
    });

    scene.add(villa);

    // ================= 庭院环境 =================
    // 半透明玻璃围栏界定庭院范围：深色木立柱 + 玻璃面板 + 中式竖棂
    const COURTYARD_HALF = 8.6; // 庭院半边长（米）
    const GATE_HALF = 1.7;      // 正面入口的半宽
    const FENCE_H = 1.35;       // 围栏高度

    const courtyard = new THREE.Group();
    courtyard.name = 'courtyard';
    scene.add(courtyard);

    // 草坪凹凸贴图：中灰噪声 + 稀疏草叶短笔触，只扰动法线，不改变低饱和的卡通配色
    function createGrassBumpTexture() {
      const size = 128;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');

      let seed = 20261111;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      const img = ctx.createImageData(size, size);
      for (let i = 0; i < size * size; i++) {
        const v = 110 + Math.floor(rand() * 50);
        img.data[i * 4] = v;
        img.data[i * 4 + 1] = v;
        img.data[i * 4 + 2] = v;
        img.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);

      ctx.strokeStyle = 'rgba(232, 232, 232, 0.55)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 220; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const len = 2 + rand() * 4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (rand() - 0.5) * 2, y - len);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(28, 28);
      tex.anisotropy = 4;
      return tex; // bumpMap 是线性数据，保持默认 NoColorSpace
    }

    // 庭院草地 + 入户石径（颜色随昼夜一起插值）
    // 草坪保持卡通低饱和，只用很轻的 bumpMap 增加近景细节
    const courtyardGroundMat = new THREE.MeshStandardMaterial({
      color: 0x6f8a5f,
      roughness: 1,
      metalness: 0,
      bumpMap: createGrassBumpTexture(),
      bumpScale: 0.06
    });
    const courtyardPathMat = new THREE.MeshStandardMaterial({
      color: 0x8a9099, roughness: 0.96, metalness: 0.02,
      emissive: 0x2f3a46, emissiveIntensity: 0 // 夜间给石板一点冷调自发光，避免完全没入黑暗
    });

    const courtyardGround = new THREE.Mesh(
      new THREE.PlaneGeometry(COURTYARD_HALF * 2, COURTYARD_HALF * 2),
      courtyardGroundMat
    );
    courtyardGround.rotation.x = -Math.PI / 2;
    courtyardGround.position.y = 0.004;
    courtyardGround.receiveShadow = true;
    courtyard.add(courtyardGround);

    // 灰色石板路：两列错缝铺装，单次 InstancedMesh 绘制，低开销也有细节
    const pathStartZ = 3.98;  // 别墅台基外缘
    const pathEndZ = COURTYARD_HALF - 0.18;
    const slabW = 1.18;
    const slabD = 0.62;
    const slabGap = 0.09;
    const slabRows = Math.floor((pathEndZ - pathStartZ) / (slabD + slabGap));
    const slabCols = 2;
    const stonePath = new THREE.InstancedMesh(
      // 石板同样使用圆角几何体：边缘被轻微磨圆，像被踩了很多年的旧石料
      getRoundedBoxGeometry(slabW, 0.05, slabD),
      courtyardPathMat,
      slabRows * slabCols
    );
    stonePath.name = 'stone-path';
    stonePath.receiveShadow = true;
    stonePath.castShadow = false;

    const slabDummy = new THREE.Object3D();
    let slabIndex = 0;
    for (let row = 0; row < slabRows; row++) {
      for (let col = 0; col < slabCols; col++) {
        slabDummy.position.set(
          (col - (slabCols - 1) / 2) * (slabW + 0.12),
          0.026,
          pathStartZ + slabD / 2 + row * (slabD + slabGap)
        );
        // 极轻微的错位，避免像一条打印出来的灰带
        slabDummy.rotation.y = ((row + col) % 2 === 0 ? 1 : -1) * 0.008;
        slabDummy.updateMatrix();
        stonePath.setMatrixAt(slabIndex, slabDummy.matrix);
        slabIndex++;
      }
    }
    stonePath.instanceMatrix.needsUpdate = true;
    courtyard.add(stonePath);

    // 门前石阶
    addBox(courtyard, [2.9, 0.1, 0.7], [0, 0.05, COURTYARD_HALF - 0.45], courtyardPathMat);

    // ---------- 围栏材质 ----------
    const fenceWoodMat = new THREE.MeshStandardMaterial({
      color: 0x3a2d26, roughness: 0.7, metalness: 0.08
    });
    const fenceGlassMat = new THREE.MeshStandardMaterial({
      color: 0xcfe8ee,
      emissive: 0x5c88a8,
      emissiveIntensity: 0,
      roughness: 0.32,
      metalness: 0.02,
      envMapIntensity: 0.4,
      transparent: true,
      opacity: 0.16,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const fenceGroup = new THREE.Group();
    fenceGroup.name = 'fence';
    courtyard.add(fenceGroup);

    const fencePosts = new Map();

    function registerFencePost(x, z) {
      const key = x.toFixed(2) + ':' + z.toFixed(2);
      if (!fencePosts.has(key)) fencePosts.set(key, [x, z]);
    }

    function addFenceRail(ax, az, bx, bz, y, height, depth) {
      const len = Math.hypot(bx - ax, bz - az);
      const rail = addBox(
        fenceGroup,
        [len, height, depth],
        [(ax + bx) / 2, y, (az + bz) / 2],
        fenceWoodMat
      );
      rail.rotation.y = Math.atan2(-(bz - az), bx - ax);
      return rail;
    }

    function addFenceRun(ax, az, bx, bz) {
      const dx = bx - ax;
      const dz = bz - az;
      const len = Math.hypot(dx, dz);
      if (len < 0.2) return;

      const angle = Math.atan2(-dz, dx);
      const panelH = FENCE_H - 0.5;

      // 半透明玻璃面板（不投影，避免地面出现大块暗影）
      const glass = addBox(
        fenceGroup,
        [len - 0.16, panelH, 0.04],
        [(ax + bx) / 2, 0.3 + panelH / 2, (az + bz) / 2],
        fenceGlassMat
      );
      glass.rotation.y = angle;
      glass.castShadow = false;
      glass.receiveShadow = false;

      // 上下木横档
      addFenceRail(ax, az, bx, bz, 0.3, 0.07, 0.1);
      addFenceRail(ax, az, bx, bz, FENCE_H - 0.06, 0.09, 0.18);

      // 中式木格栅竖棂
      const bars = Math.max(2, Math.round(len / 1.55));
      const barH = FENCE_H - 0.42;
      for (let i = 1; i < bars; i++) {
        const t = i / bars;
        addBox(
          fenceGroup,
          [0.05, barH, 0.07],
          [ax + dx * t, 0.3 + barH / 2, az + dz * t],
          fenceWoodMat
        );
      }

      // 均匀布置立柱（拐角处按键值去重）
      const posts = Math.max(1, Math.round(len / 2.15));
      for (let i = 0; i <= posts; i++) {
        const t = i / posts;
        registerFencePost(ax + dx * t, az + dz * t);
      }
    }

    // 正面（+Z）留出入口，其余三面完整围合
    addFenceRun(-COURTYARD_HALF, COURTYARD_HALF, -GATE_HALF, COURTYARD_HALF);
    addFenceRun(GATE_HALF, COURTYARD_HALF, COURTYARD_HALF, COURTYARD_HALF);
    addFenceRun(COURTYARD_HALF, COURTYARD_HALF, COURTYARD_HALF, -COURTYARD_HALF);
    addFenceRun(COURTYARD_HALF, -COURTYARD_HALF, -COURTYARD_HALF, -COURTYARD_HALF);
    addFenceRun(-COURTYARD_HALF, -COURTYARD_HALF, -COURTYARD_HALF, COURTYARD_HALF);

    for (const [px, pz] of fencePosts.values()) {
      addBox(fenceGroup, [0.16, FENCE_H + 0.12, 0.16], [px, (FENCE_H + 0.12) / 2, pz], fenceWoodMat);
      addBox(fenceGroup, [0.26, 0.08, 0.26], [px, FENCE_H + 0.16, pz], fenceWoodMat);
    }

    // 中式门头：两根高立柱 + 横梁 + 小坡顶
    for (const sx of [-1, 1]) {
      addBox(fenceGroup, [0.22, 2.05, 0.22], [sx * GATE_HALF, 1.025, COURTYARD_HALF], fenceWoodMat);
      addBox(fenceGroup, [0.34, 0.1, 0.34], [sx * GATE_HALF, 2.1, COURTYARD_HALF], fenceWoodMat);
    }
    addBox(
      fenceGroup,
      [GATE_HALF * 2 + 0.5, 0.16, 0.26],
      [0, 2.0, COURTYARD_HALF],
      fenceWoodMat
    );
    addBox(
      fenceGroup,
      [GATE_HALF * 2 + 0.9, 0.1, 0.62],
      [0, 2.13, COURTYARD_HALF],
      roofMat
    );

    // ---------- 庭院树木（圆柱树干 + 球体 / 圆锥树冠） ----------
    const treeGroup = new THREE.Group();
    treeGroup.name = 'trees';
    courtyard.add(treeGroup);

    // 固定随机种子，保证每次打开页面时庭院布局一致
    function makeRandom(seed) {
      let s = seed >>> 0;
      return function random() {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }
    const gardenRandom = makeRandom(20261111);

    const trunkGeo = new THREE.CylinderGeometry(0.12, 0.2, 1, 7);
    const canopyBlobGeo = new THREE.IcosahedronGeometry(1, 1);
    const canopyConeGeo = new THREE.ConeGeometry(1, 1.6, 8);
    const trunkMat = new THREE.MeshStandardMaterial({
      color: 0x5a4033, roughness: 0.9, metalness: 0.02
    });
    // 深绿低饱和树冠：夜里不会被月光照成荧光绿
    const leafMats = [0x2f5a3e, 0x376b47, 0x244a33].map(
      (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.96, metalness: 0 })
    );

    // ================= 外部 GLTF 模型加载 =================
    const gltfLoader = new GLTFLoader();
    const modelCache = new Map();          // 同一 url 只下载一次，后续实例 clone
    const externalModelMeshes = [];        // 供漫游射线碰撞使用
    let roamRayTargetsReady = false;

    // 外部模型统一挂在独立 Group 下，方便整体移动 / 显隐 / 调试
    const externalModels = new THREE.Group();
    externalModels.name = 'external-models';
    scene.add(externalModels);

    // 通用加载函数：loadModel('models/tree_oak.glb', [-11.6, 0, 8.4], { scale: 1.05 })
    // - 自动开启投影 / 接收阴影，并沿用 scene.environment 做 PBR 反射；
    // - 返回 Promise<THREE.Group>，方便 .then() 里继续调位置 / 动画。
    function loadModel(url, position = [0, 0, 0], options = {}) {
      const {
        scale = 1,
        rotationY = 0,
        parent = externalModels,
        castShadow = true,
        receiveShadow = true
      } = options;

      return new Promise((resolve, reject) => {
        const instantiate = (gltf) => {
          // clone 让同一份模型可以在场景里摆多棵，互不影响
          const model = gltf.scene.clone(true);
          model.position.set(position[0], position[1], position[2]);
          model.rotation.y = rotationY;
          model.scale.setScalar(scale);

          const meshes = [];
          model.traverse((obj) => {
            if (!obj.isMesh) return;
            obj.castShadow = castShadow;
            obj.receiveShadow = receiveShadow;
            meshes.push(obj);

            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            for (const mat of mats) {
              // 没有显式 envMap 的材质会自动使用 scene.environment
              if (mat && 'envMapIntensity' in mat) mat.envMapIntensity = 1.0;
            }
          });

          parent.add(model);
          for (const mesh of meshes) {
            externalModelMeshes.push(mesh);
            if (roamRayTargetsReady) roamRayTargets.push(mesh);
          }

          console.info('[villa] 已加载外部模型:', url);
          resolve(model);
        };

        const cached = modelCache.get(url);
        if (cached) {
          instantiate(cached);
          return;
        }

        gltfLoader.load(
          url,
          (gltf) => {
            modelCache.set(url, gltf);
            instantiate(gltf);
          },
          undefined,
          (error) => {
            console.error('[villa] 外部模型加载失败:', url, error);
            reject(error);
          }
        );
      });
    }
    // 控制台可直接调用：loadModel('models/tree_oak.glb', [0, 0, 0])
    window.loadModel = loadModel;

    function addTree(x, z, scale, kind) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.rotation.y = gardenRandom() * Math.PI * 2;
      treeGroup.add(tree);

      const trunkH = (1.7 + gardenRandom() * 1.0) * scale;
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.scale.set(scale, trunkH, scale);
      trunk.position.y = trunkH / 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tree.add(trunk);

      if (kind === 'pine') {
        // 圆锥层叠树冠
        const mat = leafMats[Math.floor(gardenRandom() * leafMats.length)];
        for (let i = 0; i < 3; i++) {
          const cone = new THREE.Mesh(canopyConeGeo, mat);
          const s = (1.25 - i * 0.26) * scale;
          cone.scale.set(s, s, s);
          cone.position.y = trunkH + (0.3 + i * 0.52) * scale;
          cone.rotation.y = gardenRandom() * Math.PI;
          cone.castShadow = true;
          tree.add(cone);
        }
        return;
      }

      // 阔叶树：2~3 个多面体团成树冠，保持 Low-Poly 块面感
      const mat = leafMats[Math.floor(gardenRandom() * leafMats.length)];
      const blobs = 2 + Math.floor(gardenRandom() * 2);
      for (let i = 0; i < blobs; i++) {
        const r = (0.82 + gardenRandom() * 0.5) * scale;
        const blob = new THREE.Mesh(canopyBlobGeo, mat);
        blob.scale.set(r, r * 0.84, r);
        blob.position.set(
          (gardenRandom() - 0.5) * 0.9 * scale,
          trunkH + (0.35 + gardenRandom() * 0.5) * scale,
          (gardenRandom() - 0.5) * 0.9 * scale
        );
        blob.castShadow = true;
        blob.receiveShadow = true;
        tree.add(blob);
      }
    }

    // 固定 5 棵 Low-Poly 树：给院门与主立面留出视线，数量克制、避免遮挡
    const TREE_LAYOUT = [
      [-11.6, 8.4, 1.05, 'pine'],
      [11.9, 7.6, 1.0, 'leaf'],
      [-12.4, -4.2, 1.1, 'leaf'],
      [12.2, -6.0, 0.95, 'pine'],
      [0.0, -14.8, 1.2, 'pine']
    ];

    // ---------- 如何把圆锥体树换成下载的高质量树木模型 ----------
    // 1. 从 Poly Haven / Sketchfab / Quaternius 下载带贴图的 .glb（不要用几十 MB 的扫描模型，
    //    单棵树 1~5 MB、面数 1 万左右最适合这个场景）；
    // 2. 放到 index.html 同目录的 models/ 文件夹，例如 models/tree_oak.glb（建议用本地服务器打开）；
    // 3. 把下面 TREE_MODEL_URL 改成 'models/tree_oak.glb'，刷新页面即可用外模替换 5 棵 Low-Poly 树；
    // 4. 若只想替换其中一棵，保持 TREE_MODEL_URL 为空，手动调用：
    //    loadModel('models/tree_oak.glb', [-11.6, 0, 8.4], { scale: 1.05, rotationY: 0.6 });
    //    并从 TREE_LAYOUT 里删掉对应的一行。
    // 加载失败会自动回退到原来的 Low-Poly 树，页面不会变空。
    const TREE_MODEL_URL = ''; // 例如 'models/tree_oak.glb'

    for (const [x, z, scale, kind] of TREE_LAYOUT) {
      if (TREE_MODEL_URL) {
        loadModel(TREE_MODEL_URL, [x, 0, z], {
          scale,
          parent: treeGroup,
          rotationY: gardenRandom() * Math.PI * 2
        }).catch(() => {
          // 外部模型失败时保留原来的圆锥 / 多面体树
          addTree(x, z, scale, kind);
        });
      } else {
        addTree(x, z, scale, kind);
      }
    }

    // ================= 外围森林：200 棵实例化大树 =================
    // ★ 调大树数量：只改 FOREST_TREE_COUNT（200 → 300 / 400 都行）。
    // ★ 调大森林范围：改 FOREST_RANGE（40 表示 X / Z ∈ [-40, 40]）。
    // 树干 / 阔叶树冠 / 松树锥冠各 1 个 InstancedMesh，200 棵树只增加 3 个 draw call。
    const FOREST_TREE_COUNT = CONFIG.counts.forestTrees;
    const FOREST_RANGE = CONFIG.counts.forestRange;
    const forestRandom = makeRandom(20261115);
    const forestTrees = [];

    let forestGuard = 0;
    while (forestTrees.length < FOREST_TREE_COUNT && forestGuard++ < FOREST_TREE_COUNT * 160) {
      const x = (forestRandom() - 0.5) * FOREST_RANGE * 2;
      const z = (forestRandom() - 0.5) * FOREST_RANGE * 2;

      // 房子 + 庭院：中间 25m × 25m 完全留空（含 2.5m 缓冲）
      if (Math.abs(x) < 12.5 && Math.abs(z) < 12.5) continue;
      // 河道与两岸：不让树长在水里，也避免树根悬空
      if (Math.abs(z - RIVER_CENTER_Z) < RIVER_HALF_WIDTH + 2.6) continue;
      // 院门 → 木桥的动线走廊
      if (Math.abs(x) < 5 && z > COURTYARD_HALF - 1 && z < BRIDGE_END_Z + 3) continue;
      // 默认机位（x≈11 / z≈32）与别墅之间留一条观察窗，别让前排树挡住主立面
      if (z > 26 && z < 35 && Math.abs(x) < 8.5) continue;

      const scale = 0.72 + forestRandom() * 0.95; // 0.72~1.67：高矮错落，不是复制粘贴
      const kind = forestRandom() < 0.34 ? 'pine' : 'leaf';
      forestTrees.push({
        x,
        z,
        scale,
        kind,
        trunkH: (1.5 + forestRandom() * 1.1) * scale,
        yaw: forestRandom() * Math.PI * 2,
        tone: leafMats[Math.floor(forestRandom() * leafMats.length)].color
      });
    }

    const forestTrunkInstances = [];
    const forestLeafInstances = [];
    const forestPineInstances = [];

    for (const tree of forestTrees) {
      const trunkRadius = tree.scale * (0.85 + forestRandom() * 0.35);
      forestTrunkInstances.push({
        x: tree.x,
        z: tree.z,
        y: tree.trunkH / 2,
        yaw: tree.yaw,
        sx: trunkRadius,
        sy: tree.trunkH,
        sz: trunkRadius
      });

      if (tree.kind === 'pine') {
        // 松树：3 层圆锥，越往上越小
        for (let i = 0; i < 3; i++) {
          const s = (1.15 - i * 0.24) * tree.scale * (0.92 + forestRandom() * 0.16);
          forestPineInstances.push({
            x: tree.x + (forestRandom() - 0.5) * 0.12 * tree.scale,
            y: tree.trunkH + (0.18 + i * 0.48) * tree.scale,
            z: tree.z + (forestRandom() - 0.5) * 0.12 * tree.scale,
            size: s,
            yaw: forestRandom() * Math.PI,
            tone: tree.tone
          });
        }
      } else {
        // 阔叶树：3 团多面体树冠，随机大小 / 位置，轮廓不重复
        for (let i = 0; i < 3; i++) {
          const canopyScale = (0.88 + forestRandom() * 0.62) * tree.scale;
          forestLeafInstances.push({
            x: tree.x + (forestRandom() - 0.5) * 1.25 * tree.scale,
            y: tree.trunkH + (0.32 + forestRandom() * 0.62) * tree.scale,
            z: tree.z + (forestRandom() - 0.5) * 1.25 * tree.scale,
            sx: canopyScale,
            sy: canopyScale * (0.78 + forestRandom() * 0.28),
            sz: canopyScale,
            yaw: forestRandom() * Math.PI,
            tone: tree.tone
          });
        }
      }
    }

    const forestGroup = new THREE.Group();
    forestGroup.name = 'forest';
    scene.add(forestGroup);

    const forestDummy = new THREE.Object3D();
    const forestColor = new THREE.Color();

    const forestTrunkMesh = new THREE.InstancedMesh(
      trunkGeo,
      trunkMat,
      forestTrunkInstances.length
    );
    forestTrunkMesh.name = 'forest-trunks';
    forestTrunkMesh.castShadow = true;
    forestTrunkMesh.receiveShadow = true;
    forestTrunkInstances.forEach((inst, i) => {
      forestDummy.position.set(inst.x, inst.y, inst.z);
      forestDummy.rotation.set(0, inst.yaw, 0);
      forestDummy.scale.set(inst.sx, inst.sy, inst.sz);
      forestDummy.updateMatrix();
      forestTrunkMesh.setMatrixAt(i, forestDummy.matrix);
    });
    forestTrunkMesh.instanceMatrix.needsUpdate = true;
    forestTrunkMesh.computeBoundingSphere?.();
    forestGroup.add(forestTrunkMesh);

    const forestLeafMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, // 真正的深绿来自 instanceColor，和庭院 5 棵树同一套色板
      roughness: 0.96,
      metalness: 0,
      flatShading: true
    });
    const forestLeafMesh = new THREE.InstancedMesh(
      canopyBlobGeo,
      forestLeafMat,
      forestLeafInstances.length
    );
    forestLeafMesh.name = 'forest-leaf-canopies';
    forestLeafMesh.castShadow = true;
    forestLeafMesh.receiveShadow = true;
    forestLeafInstances.forEach((inst, i) => {
      forestDummy.position.set(inst.x, inst.y, inst.z);
      forestDummy.rotation.set(0, inst.yaw, 0);
      forestDummy.scale.set(inst.sx, inst.sy, inst.sz);
      forestDummy.updateMatrix();
      forestLeafMesh.setMatrixAt(i, forestDummy.matrix);
      forestLeafMesh.setColorAt(i, forestColor.copy(inst.tone));
    });
    forestLeafMesh.instanceMatrix.needsUpdate = true;
    if (forestLeafMesh.instanceColor) forestLeafMesh.instanceColor.needsUpdate = true;
    forestLeafMesh.computeBoundingSphere?.();
    forestGroup.add(forestLeafMesh);

    const forestPineMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.96,
      metalness: 0,
      flatShading: true
    });
    const forestPineMesh = new THREE.InstancedMesh(
      canopyConeGeo,
      forestPineMat,
      forestPineInstances.length
    );
    forestPineMesh.name = 'forest-pine-canopies';
    forestPineMesh.castShadow = true;
    forestPineMesh.receiveShadow = true;
    forestPineInstances.forEach((inst, i) => {
      forestDummy.position.set(inst.x, inst.y, inst.z);
      forestDummy.rotation.set(0, inst.yaw, 0);
      forestDummy.scale.set(inst.size, inst.size, inst.size);
      forestDummy.updateMatrix();
      forestPineMesh.setMatrixAt(i, forestDummy.matrix);
      forestPineMesh.setColorAt(i, forestColor.copy(inst.tone));
    });
    forestPineMesh.instanceMatrix.needsUpdate = true;
    if (forestPineMesh.instanceColor) forestPineMesh.instanceColor.needsUpdate = true;
    forestPineMesh.computeBoundingSphere?.();
    forestGroup.add(forestPineMesh);

    // 庭院四角低矮灌木，增强庭院的层次
    for (const [bx, bz] of [[-6.2, 5.6], [6.2, 5.6], [-6.2, -5.8], [6.2, -5.8]]) {
      const bush = new THREE.Mesh(canopyBlobGeo, leafMats[1]);
      bush.scale.set(0.58, 0.44, 0.58);
      bush.position.set(bx, 0.42, bz);
      bush.castShadow = true;
      bush.receiveShadow = true;
      courtyard.add(bush);
    }

    // ================= 草地 / 河流 / 木桥 / 灌木 / 石头 =================
    // 统一原则：重复物件全部走 InstancedMesh，草地 4800 丛也只占 1 个 draw call；
    // 桥体只保留 2 个实例化网格，避免几十个独立 Mesh 把 draw call 拉高。
    const gardenDetailRandom = makeRandom(20261112);

    // 庭院四角灌木坐标（草地避让 / 漫游碰撞共用）
    const COURTYARD_BUSH_SPOTS = [[-6.2, 5.6], [6.2, 5.6], [-6.2, -5.8], [6.2, -5.8]];

    // ---------- 庭院外的大草坪：把原来空旷的深灰地面铺成草地 ----------
    const meadowMat = new THREE.MeshStandardMaterial({
      color: 0x6d8a5c,
      roughness: 1,
      metalness: 0,
      bumpMap: (() => {
        const tex = createGrassBumpTexture();
        tex.repeat.set(64, 64); // 大范围草地，纹理重复更多，近景才不糊
        return tex;
      })(),
      bumpScale: 0.05
    });
    const meadow = new THREE.Mesh(new THREE.PlaneGeometry(130, 130), meadowMat);
    meadow.name = 'meadow';
    meadow.rotation.x = -Math.PI / 2;
    meadow.position.y = 0.002; // 低于庭院草坪（0.004），院内不会被它盖住
    meadow.receiveShadow = true;
    scene.add(meadow);

    // ---------- 河流：水面 + 河床，横穿庭院前方的草地 ----------
    const riverBankMat = new THREE.MeshStandardMaterial({
      color: 0x6b6a52,
      roughness: 1,
      metalness: 0
    });
    const riverBank = new THREE.Mesh(
      new THREE.PlaneGeometry(RIVER_HALF_LENGTH * 2, RIVER_HALF_WIDTH * 2 + 2.2),
      riverBankMat
    );
    riverBank.name = 'river-bank';
    riverBank.rotation.x = -Math.PI / 2;
    riverBank.position.set(0, 0.008, RIVER_CENTER_Z);
    riverBank.receiveShadow = true;
    scene.add(riverBank);

    // 水面细波纹：程序化 bumpMap，只扰动法线，不额外增加面数
    function createWaterBumpTexture() {
      const size = 128;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, size, size);

      let seed = 771247;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      for (let i = 0; i < 46; i++) {
        const y = rand() * size;
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 + rand() * 0.16})`;
        ctx.lineWidth = 0.8 + rand() * 1.6;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= size; x += 8) {
          ctx.lineTo(x, y + Math.sin((x / size) * Math.PI * 4 + i) * 1.8);
        }
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(20, 3);
      return tex; // bumpMap 是线性数据，保持默认 NoColorSpace
    }
    const waterBumpTexture = createWaterBumpTexture();

    const riverWaterMat = new THREE.MeshStandardMaterial({
      color: CONFIG.colors.day.river,
      // 水面严禁镜面：高粗糙度 + 0 金属度，只保留柔和的天空漫反射
      roughness: CONFIG.materials.waterRoughness,
      metalness: CONFIG.materials.waterMetalness,
      envMapIntensity: CONFIG.materials.waterEnvMapIntensity,
      transparent: true,
      opacity: CONFIG.materials.waterOpacity,
      bumpMap: waterBumpTexture,
      bumpScale: CONFIG.materials.waterBumpScale, // 用细波纹提供水面细节，而不是靠高光
      emissive: CONFIG.colors.material.waterEmissive, // 夜间只靠这点冷蓝自发光保留水色
      emissiveIntensity: 0
    });
    const riverWater = new THREE.Mesh(
      new THREE.PlaneGeometry(RIVER_HALF_LENGTH * 2, RIVER_HALF_WIDTH * 2),
      riverWaterMat
    );
    riverWater.name = 'river-water';
    riverWater.rotation.x = -Math.PI / 2;
    riverWater.position.set(0, 0.035, RIVER_CENTER_Z);
    riverWater.receiveShadow = true;
    scene.add(riverWater);

    // ---------- 水面涟漪：几张随时间扩散、淡出的圆环贴片 ----------
    // 用 PlaneGeometry + 程序化圆环贴图，不引入外部法线 / 纹理资源；
    // 每个涟漪独立缩放 + 透明度衰减，模拟水滴落入或鱼儿游过后的波纹。
    function createRippleTexture() {
      const size = 128;
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');
      const c = size / 2;

      const grad = ctx.createRadialGradient(c, c, 0, c, c, c);
      grad.addColorStop(0.0, 'rgba(255, 255, 255, 0)');
      grad.addColorStop(0.56, 'rgba(255, 255, 255, 0)');
      grad.addColorStop(0.72, 'rgba(255, 255, 255, 0.92)');
      grad.addColorStop(0.82, 'rgba(255, 255, 255, 0.16)');
      grad.addColorStop(0.9, 'rgba(255, 255, 255, 0.42)');
      grad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    const rippleTexture = createRippleTexture();
    const ripplePlaneGeo = new THREE.PlaneGeometry(1, 1);
    const rippleRandom = makeRandom(20261118);
    const waterRipples = [];

    for (let i = 0; i < CONFIG.ripples.count; i++) {
      const rippleMat = new THREE.MeshBasicMaterial({
        map: rippleTexture,
        color: 0xbfe9ff,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
      const ripple = new THREE.Mesh(ripplePlaneGeo, rippleMat);
      ripple.name = 'water-ripple-' + i;
      ripple.rotation.x = -Math.PI / 2;
      ripple.position.set(
        (rippleRandom() - 0.5) * 2 * (RIVER_HALF_LENGTH - 8),
        0.046,
        RIVER_CENTER_Z + (rippleRandom() - 0.5) * 2 * (RIVER_HALF_WIDTH - 0.9)
      );
      ripple.renderOrder = 3;
      scene.add(ripple);

      waterRipples.push({
        mesh: ripple,
        mat: rippleMat,
        phase: rippleRandom(),
        speed: THREE.MathUtils.lerp(
          CONFIG.ripples.speedMin,
          CONFIG.ripples.speedMax,
          rippleRandom()
        ),
        maxSize: THREE.MathUtils.lerp(
          CONFIG.ripples.sizeMin,
          CONFIG.ripples.sizeMax,
          rippleRandom()
        )
      });
    }

    // time 为全局秒数；nightFactor 让涟漪在夜色里稍微亮一点
    function updateWaterRipples(time, nightFactor) {
      const visibility = CONFIG.ripples.opacity * (1 + CONFIG.ripples.nightBoost * nightFactor);
      for (const ripple of waterRipples) {
        const cycle = (time * ripple.speed + ripple.phase) % 1;
        const size = 0.45 + cycle * ripple.maxSize;
        ripple.mesh.scale.set(size, size, 1);
        const fade = (1 - cycle) * (1 - cycle);
        ripple.mat.opacity = fade * visibility;
      }
    }

    // ---------- 木桥：扁长方体拼出桥面 + 护栏，2 个 InstancedMesh 完成 ----------
    const bridgeGroup = new THREE.Group();
    bridgeGroup.name = 'wooden-bridge';
    scene.add(bridgeGroup);

    const bridgeWoodMat = new THREE.MeshStandardMaterial({
      color: 0x7a5638, roughness: 0.88, metalness: 0.02
    });
    const bridgeDarkMat = new THREE.MeshStandardMaterial({
      color: 0x4d3524, roughness: 0.92, metalness: 0.02
    });

    const unitBoxGeo = new THREE.BoxGeometry(1, 1, 1);
    const bridgeLength = BRIDGE_END_Z - BRIDGE_START_Z;
    const bridgeCenterZ = (BRIDGE_START_Z + BRIDGE_END_Z) / 2;
    const BRIDGE_DECK_TOP = 0.16;

    // 桥面板：22 块横向木板，全部实例化
    const plankCount = 22;
    const bridgePlanks = new THREE.InstancedMesh(unitBoxGeo, bridgeWoodMat, plankCount);
    bridgePlanks.name = 'bridge-planks';
    bridgePlanks.castShadow = true;
    bridgePlanks.receiveShadow = true;

    const bridgeDummy = new THREE.Object3D();
    for (let i = 0; i < plankCount; i++) {
      const t = (i + 0.5) / plankCount;
      bridgeDummy.position.set(0, BRIDGE_DECK_TOP - 0.035, BRIDGE_START_Z + t * bridgeLength);
      bridgeDummy.rotation.set(0, (gardenDetailRandom() - 0.5) * 0.03, 0);
      bridgeDummy.scale.set(
        BRIDGE_HALF_WIDTH * 2,
        0.07,
        bridgeLength / plankCount - 0.035
      );
      bridgeDummy.updateMatrix();
      bridgePlanks.setMatrixAt(i, bridgeDummy.matrix);
    }
    bridgePlanks.instanceMatrix.needsUpdate = true;
    bridgeGroup.add(bridgePlanks);

    // 纵梁 / 端梁 / 立柱 / 扶手 / 中栏 / 踢脚：同一材质合并成 1 个实例化网格
    const bridgeFrameParts = [];
    const pushBridgePart = (x, y, z, sx, sy, sz) => {
      bridgeFrameParts.push({ x, y, z, sx, sy, sz });
    };

    for (const sx of [-1, 1]) {
      pushBridgePart(sx * 1.08, 0.07, bridgeCenterZ, 0.16, 0.16, bridgeLength);
    }
    pushBridgePart(0, 0.07, BRIDGE_START_Z + 0.1, BRIDGE_HALF_WIDTH * 2, 0.16, 0.18);
    pushBridgePart(0, 0.07, BRIDGE_END_Z - 0.1, BRIDGE_HALF_WIDTH * 2, 0.16, 0.18);

    const bridgePostCount = 9;
    for (const sx of [-1, 1]) {
      for (let i = 0; i < bridgePostCount; i++) {
        const t = i / (bridgePostCount - 1);
        const z = BRIDGE_START_Z + 0.16 + t * (bridgeLength - 0.32);
        pushBridgePart(sx * (BRIDGE_HALF_WIDTH - 0.05), BRIDGE_DECK_TOP + 0.47, z, 0.1, 0.94, 0.1);
      }
      pushBridgePart(
        sx * (BRIDGE_HALF_WIDTH - 0.05), BRIDGE_DECK_TOP + 0.94, bridgeCenterZ,
        0.09, 0.09, bridgeLength
      );
      pushBridgePart(
        sx * (BRIDGE_HALF_WIDTH - 0.05), BRIDGE_DECK_TOP + 0.56, bridgeCenterZ,
        0.07, 0.07, bridgeLength
      );
      pushBridgePart(
        sx * (BRIDGE_HALF_WIDTH - 0.05), BRIDGE_DECK_TOP + 0.1, bridgeCenterZ,

    }

    const bridgeFrame = new THREE.InstancedMesh(
      unitBoxGeo,

    );
    bridgeFrame.name = 'bridge-frame';
    bridgeFrame.castShadow = true;

    bridgeFrameParts.forEach((part, i) => {
      bridgeDummy.position.set(part.x, part.y, part.z);
      bridgeDummy.rotation.set(0, 0, 0);
      bridgeDummy.scale.set(part.sx, part.sy, part.sz);
      bridgeDummy.updateMatrix();
      bridgeFrame.setMatrixAt(i, bridgeDummy.matrix);
    });
    bridgeFrame.instanceMatrix.needsUpdate = true;
    bridgeGroup.add(bridgeFrame);

    // ---------- 院门到桥头的踏步石：让“别墅 → 草地 → 木桥”连成一条动线 ----------
    const approachPath = new THREE.InstancedMesh(

    );

        approachDummy.position.set((col - 0.5) * 1.1, 0.03, 9.4 + row * 0.95);
        approachDummy.rotation.y = ((row + col) % 2 === 0 ? 1 : -1) * 0.012;
        approachDummy.updateMatrix();

    }
    approachPath.instanceMatrix.needsUpdate = true;
    scene.add(approachPath);

    // ================= 生活化细节：中式庭院 / 河道 / 夜空 =================
    // 统一原则：这些小物件全部 castShadow = false，不参与阴影 pass；
    // 竹节 / 竹叶 / 芦苇 / 孔明灯等重复物件走 InstancedMesh，避免几十个独立 Mesh 拉高 draw call。
    const LIFE = CONFIG.life;
    const lifeRandom = makeRandom(20261202);

    // ---------- 红灯笼：圆柱灯身 + 金色上下箍 + 吊绳 + 流苏 ----------
    const lanternBodyGeo = new THREE.CylinderGeometry(0.19, 0.19, 0.34, 8);
    const lanternRimGeo = new THREE.CylinderGeometry(0.215, 0.215, 0.035, 8);
    const lanternTasselGeo = new THREE.ConeGeometry(0.045, 0.2, 6);
    const lanternRopeGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.16, 3);

    const lanternRedMat = new THREE.MeshStandardMaterial({
      color: 0x4a0c08,
      emissive: LIFE.lanternRed,
      emissiveIntensity: 0.9, // 白天是哑光红灯笼；夜间 updateDayNight 推到 2.8，越过 Bloom 阈值
      roughness: 0.62,
      metalness: 0.02
    });
    const lanternGoldMat = new THREE.MeshStandardMaterial({
      color: LIFE.lanternGold, roughness: 0.42, metalness: 0.55
    });
    const lanternTasselMat = new THREE.MeshStandardMaterial({
      color: LIFE.lanternTassel, roughness: 0.8, metalness: 0.02
    });
    const lanternRopeMat = new THREE.MeshStandardMaterial({
      color: 0x241a14, roughness: 0.95
    });

    // 灯笼柔光：白天关闭，夜里用一张叠加 Sprite 模拟红晕，避免把灯身自发光推到 ACES 泛白
    function createLanternHaloTexture() {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(255,226,190,0.85)');
      grad.addColorStop(0.2, 'rgba(255,126,78,0.48)');
      grad.addColorStop(0.55, 'rgba(255,54,24,0.16)');
      grad.addColorStop(1, 'rgba(255,30,10,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }
    const lanternHaloMat = new THREE.SpriteMaterial({
      map: createLanternHaloTexture(),
      color: 0xff8f62,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      opacity: 0
    });
    lanternHaloMat.visible = false;

    function createRedLantern(x, y, z, scale = 1) {
      const lantern = new THREE.Group();
      lantern.position.set(x, y, z);
      lantern.scale.setScalar(scale);

      const body = new THREE.Mesh(lanternBodyGeo, lanternRedMat);
      lantern.add(body);

      for (const sy of [-1, 1]) {
        const rim = new THREE.Mesh(lanternRimGeo, lanternGoldMat);
        rim.position.y = sy * 0.185;
        lantern.add(rim);
      }

      const rope = new THREE.Mesh(lanternRopeGeo, lanternRopeMat);
      rope.position.y = 0.29;
      lantern.add(rope);

      const tassel = new THREE.Mesh(lanternTasselGeo, lanternTasselMat);
      tassel.position.y = -0.285;
      tassel.rotation.x = Math.PI; // 尖端朝下
      lantern.add(tassel);

      const halo = new THREE.Sprite(lanternHaloMat);
      halo.position.y = 0.02;
      halo.scale.set(1.6, 1.6, 1);
      halo.renderOrder = 6;
      lantern.add(halo);

      lantern.traverse((obj) => {
        if (!obj.isMesh) return;
        obj.castShadow = false;
        obj.receiveShadow = false;
      });
      return lantern;
    }

    const lanternGroups = { porch: null, bridge: null };

    function addLanterns() {
      // 一楼门廊两侧：挂在一层屋檐下，跟随「只看某层」剖切一起隐藏
      const porchGroup = new THREE.Group();
      porchGroup.name = 'porch-lanterns';
      floorGroups[0].add(porchGroup);
      for (const sx of [-1, 1]) {
        porchGroup.add(createRedLantern(sx * 3.02, 2.62, 4.02, 1.0));
      }

      // 木桥两头：各立一根小木柱，挑臂向外伸，挂一盏红灯笼
      const bridgeLanternGroup = new THREE.Group();
