        DAY.environmentIntensity,
        NIGHT.environmentIntensity,
        t
      );

      // 泛光只在夜色中渐入：白天 0，深夜 BLOOM_STRENGTH（0.3~0.5 的克制区间）
      bloomPass.strength = BLOOM_STRENGTH * THREE.MathUtils.smoothstep(t, 0.35, 0.95);
      // 白天直接跳过整条 Bloom Pass，省下 5 次降采样模糊
      bloomPass.enabled = t > 0.01;
    }

    // ---------- 自适应窗口 ----------
    window.addEventListener('resize', onResize);

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(w, h);
      composer.setPixelRatio(pixelRatio);
      composer.setSize(w, h);
      labelRenderer.setSize(w, h);
    }

    // ---------- 渲染循环 ----------
    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      renderer.info.reset();
      const dt = Math.min(clock.getDelta(), 0.1); // 防止切回标签页时出现跳变
      frameTimeMs += (dt * 1000 - frameTimeMs) * 0.08;
      updateDayNight(dt);
      particles.update(dt, nightMix);
      fallingLeaves.update(dt);

      const time = clock.elapsedTime;

      // 水面波纹缓慢流动：只改纹理 offset，不增加任何几何 / draw call
      waterBumpTexture.offset.y -= dt * CONFIG.water.uvDriftSpeed;
      waterBumpTexture.offset.x = Math.sin(time * CONFIG.water.uvSwaySpeed) * CONFIG.water.uvSwayAmount;
      waterBumpTexture.rotation = Math.sin(time * 0.11) * 0.15;

      // bump 强度与透明度做轻微呼吸，让水面自己“活着”，而不是一张静态贴图
      const bumpBreath = Math.sin(time * CONFIG.water.bumpBreathSpeed);
      riverWaterMat.bumpScale =
        CONFIG.materials.waterBumpScale * (1 + bumpBreath * CONFIG.water.bumpBreathAmp);
      riverWaterMat.opacity = THREE.MathUtils.clamp(
        CONFIG.materials.waterOpacity
          + Math.sin(time * CONFIG.water.opacityBreathSpeed) * CONFIG.water.opacityBreathAmp
          - nightMix * 0.03,
        0.55,
        1.0
      );

      // 草叶风场：把时间推进到共享 uniform（不重建 geometry / 不增加 draw call）
      grassWindUniforms.uTime.value = time;

      // 水面涟漪：扩散 + 淡出
      updateWaterRipples(time, nightMix);

      // ---------- 生活化细节动画：乌篷船 / 芦苇 / 孔明灯 ----------
      // 全部基于同一个 clock.elapsedTime 的正弦摆动，不新增计时器；
      // 芦苇与孔明灯只改 InstancedMesh 的实例矩阵，开销与数量线性相关但 draw call 不变。
      const boat = lifeDetails.boat.group;
      boat.position.y = lifeDetails.boat.homeY + Math.sin(time * 0.75) * 0.05;
      boat.rotation.x = Math.sin(time * 0.6 + 0.8) * 0.035;    // 随波起伏
      boat.rotation.z = Math.sin(time * 0.42 + 1.7) * 0.014;   // 轻微横摇
      boat.rotation.y = lifeDetails.boat.baseYaw + Math.sin(time * 0.23) * 0.03;

      updateReeds(lifeDetails.reeds, time);
      updateSkyLanterns(lifeDetails.skyLanterns, dt, time, nightMix);

      if (roamActive) {
        updateRoam(dt);
      } else {
        controls.update();
      }

      composer.render();
      labelRenderer.render(scene, camera);
    });

    // 自动化验证 / 调试钩子（不影响页面功能）
    window.__villaDebug = {
      scene,
      camera,
      controls,
      sun,
      renderer,
      floorGroups,
      floorWallMeshes,
      outerWallMeshes,
      wallPanelsByFloor,
      interiorWallMeshes,
      ceilingSlabs,
      stairStepMeshes,
      stairRailMeshes,
      extraFloorLabels,
      floorLabels,
      interiorLights,
      xray: {
        get enabled() { return xrayEnabled; },
        set: setXray,
        get wallOpacity() { return wallMat.opacity; }
      },
      stairs: {
        get stepCount() { return stairStepMeshes.length; },
        get railCount() { return stairRailMeshes.length; },
        get baseY() { return STAIR.baseY; },
        get topY() { return STAIR.topY; },
        get hole() { return { ...STAIR.hole }; }
      },
      interior: {
        get wallCount() { return interiorWallMeshes.length; },
        get ceilingCount() { return ceilingSlabs.length; },
        get floorHeights() { return ROAM_FLOORS.map((f) => f.y); },
        get doorPass() { return ROAM_DOOR_PASS; }
      },
      courtyard,
      fenceGroup,
      treeGroup,
      forestGroup,
      stonePath,
      particles,
      fallingLeaves,
      grassMesh,
      shrubMesh,
      stoneMesh,
      bridgeGroup,
      riverWaterMat,
      waterRipples,
      grassWindUniforms,
      fireflyLights: particles.fireflyLights,
      CONFIG,
      get nightMix() { return nightMix; },
      water: {
        get roughness() { return riverWaterMat.roughness; },
        get metalness() { return riverWaterMat.metalness; },
        get envMapIntensity() { return riverWaterMat.envMapIntensity; },
        get emissiveIntensity() { return riverWaterMat.emissiveIntensity; },
        get bumpScale() { return riverWaterMat.bumpScale; },
        get opacity() { return riverWaterMat.opacity; }
      },
      forest: {
        get treeCount() { return forestTrees.length; },
        get leafCanopies() { return forestLeafMesh.count; },
        get pineCanopies() { return forestPineMesh.count; },
        get trunkInstances() { return forestTrunkMesh.count; }
      },
      meadowMat,
      wallMat,
      roofMat,
      glassMat,
      fenceGlassMat,
      courtyardGroundMat,
      showOnlyFloor,
      composer,
      loadModel,
      externalModels,
      environment: {
        get ready() { return Boolean(scene.environment); },
        get intensity() { return scene.environmentIntensity; }
      },
      roundedBox: {
        radius: ROUNDED_RADIUS,
        segments: ROUNDED_SEGMENTS,
        get cachedGeometries() { return roundedBoxGeoCache.size; }
      },
      toneMapping: {
        get mode() { return renderer.toneMapping; },
        get exposure() { return renderer.toneMappingExposure; },
        get outputPassLast() { return composer.passes[composer.passes.length - 1] instanceof OutputPass; }
      },
      bloom: {
        get strength() { return bloomPass.strength; },
        get radius() { return bloomPass.radius; },
        get threshold() { return bloomPass.threshold; },
        get enabled() { return bloomPass.enabled; }
      },
      get nightMix() { return nightMix; },
      garden: {
        get grassCount() { return grassMesh.count; },
        get grassClumpSize() { return GRASS_CLUMP_SIZE; },
        get forestTreeCount() { return forestTrees.length; },
        get shrubCount() { return shrubMesh.count; },
        get stoneCount() { return stoneMesh.count; },
        get leafCount() { return fallingLeaves.count; },
        get drawCalls() { return renderer.info.render.calls; },
        get triangles() { return renderer.info.render.triangles; },
        get frameMs() { return Number(frameTimeMs.toFixed(2)); }
      },
      life: {
        get porchLanterns() { return lifeDetails.lanterns.porch.children.filter((c) => c.isGroup).length; },
        get bridgeLanterns() { return lifeDetails.lanterns.bridge.children.filter((c) => c.isGroup).length; },
        get stoneTableParts() { return lifeDetails.stoneTable.children.length; },
        get bambooCulms() { return lifeDetails.bamboo.getObjectByName('bamboo-culms').count; },
        get bambooLeaves() { return lifeDetails.bamboo.getObjectByName('bamboo-leaves').count; },
        get reedStems() { return lifeDetails.reeds.stemMesh.count; },
        get skyLanterns() { return lifeDetails.skyLanterns.bodyMesh.count; },
        get skyLanternsVisible() { return lifeDetails.skyLanterns.group.visible; },
        get boatY() { return lifeDetails.boat.group.position.y; },
        get lanternEmissive() { return lanternRedMat.emissiveIntensity; }
      },
      lifeDetails,
      roam: {
        get active() { return roamActive; },
        get locked() { return roamLocked; },
        get eyeHeight() { return EYE_HEIGHT; },
        get position() { return camera.position.clone(); },
        get velocity() { return roamVelocity.clone(); },
        get keys() { return { ...keys }; },
        get orbitEnabled() { return controls.enabled; },
        get pointerEnabled() { return fpControls.enabled; },
        get fov() { return camera.fov; },
        get feetY() { return camera.position.y - EYE_HEIGHT; },
        get floorIndex() { return activeRoamFloor(camera.position.y - EYE_HEIGHT); },
        get groundY() {
          return sampleRoamGround(camera.position.x, camera.position.z, camera.position.y - EYE_HEIGHT);
        },
        enter: enterRoam,
        exit: exitRoam,
        setKey(code, down) {
          if (Object.hasOwn(keys, code)) keys[code] = Boolean(down);
        }
      }
    };

    // 初始化完成标记（自动化验证 / 调试用，不影响页面功能）
    document.documentElement.dataset.villaReady = '1';
  </script>
</body>
</html>
